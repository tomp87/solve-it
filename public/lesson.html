<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson · Solve It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#faf6ed;--bg2:#f2ead8;--card:#fffdf8;--text:#2b2418;--muted:#6f6556;--accent:#b5651d;--good:#1f7a52;--bad:#b23b2e;--line:rgba(43,36,24,.12);--me:#f3e3cf}
@media (prefers-color-scheme:dark){:root{--bg1:#14231b;--bg2:#1d3327;--card:#223a2c;--text:#f1ede1;--muted:#b6c0b3;--accent:#e8c468;--good:#9fd8a6;--bad:#e2897b;--line:rgba(241,237,225,.14);--me:#2d4a39}}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text);font:16px/1.55 Literata,Georgia,serif}
button{width:auto;font:600 14px 'Work Sans',system-ui,sans-serif;cursor:pointer}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;font-family:'Work Sans',system-ui,sans-serif}
header .brand{font:700 30px Caveat,cursive;color:var(--text);text-decoration:none}
header .crumb{color:var(--muted);font-size:14px}
main{max-width:1280px;margin:0 auto;padding:0 22px 40px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
h1{font:700 40px/1.1 Caveat,cursive;margin:4px 0 12px}
.video{position:relative;aspect-ratio:16/9;background:#0b1226;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.video iframe,.video #player{position:absolute;inset:0;width:100%;height:100%;border:0}
.below{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 6px;font-family:'Work Sans',system-ui,sans-serif}
.practise{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 18px;text-decoration:none;font:600 14px 'Work Sans',sans-serif}
@media (prefers-color-scheme:dark){.practise{color:#14231b}}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:12px}
.chap{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.chap .t{color:var(--muted);font-weight:500;min-width:38px}
.chap.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
aside{position:sticky;top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;height:min(78vh,720px);overflow:hidden}
.th{padding:14px 16px;border-bottom:1px solid var(--line);font-family:'Work Sans',sans-serif}
.th b{font:700 26px Caveat,cursive;display:block;line-height:1}
.ctx{margin-top:8px;font-size:13px;color:var(--muted)}
.ctx .pill{display:inline-block;background:var(--me);color:var(--text);border-radius:999px;padding:3px 10px;font-weight:600}
.log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:transparent;border:1px solid var(--line);align-self:flex-start}
.msg.me{background:var(--me);align-self:flex-end;font-family:'Work Sans',sans-serif;font-size:15px}
.msg .at{display:block;font:500 11px 'Work Sans',sans-serif;color:var(--muted);margin-bottom:2px}
.msg.err{border-color:var(--bad)}
.jump{display:inline-block;margin:4px 4px 0 0;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 10px;font-size:13px}
.cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cta a{font:600 13px 'Work Sans',sans-serif;border:1px solid var(--accent);border-radius:999px;padding:6px 12px;text-decoration:none}
.cta a.fill{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.chips button{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:500;font-size:13px}
.chips button:hover{border-color:var(--accent)}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;height:46px;max-height:120px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:transparent;color:var(--text);font:15px 'Work Sans',sans-serif}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
form button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 16px}
@media (prefers-color-scheme:dark){form button,.cta a.fill{color:#14231b}}
form button:disabled{opacity:.5;cursor:default}
.typing{color:var(--muted);font-style:italic;font-size:14px}
.empty{color:var(--muted);font-size:14px;margin:auto 0;text-align:center;padding:0 10px}
.notfound{grid-column:1/-1;text-align:center;padding:80px 0;font-family:'Work Sans',sans-serif}
@media (max-width:900px){
  main{grid-template-columns:1fr;padding:0 12px 30px}
  aside{position:static;height:auto;min-height:420px}
  .log{max-height:55vh}
  h1{font-size:32px}
}
</style>
</head>
<body>
<header><a class="brand" href="/">🌙 Solve It</a><span class="crumb" id="crumb">Video lessons</span></header>
<main id="main">
  <section>
    <h1 id="title">Loading…</h1>
    <div class="video"><div id="player"></div></div>
    <div class="below">
      <a class="practise" id="practise" href="/app">Practise this topic →</a>
      <span class="ctx" id="nowCh"></span>
    </div>
    <div class="chapters" id="chapters"></div>
  </section>
  <aside>
    <div class="th"><b>Ask the tutor</b>
      <div class="ctx" id="ctx">Pause the video whenever something doesn’t click, and ask about what’s on screen.</div>
    </div>
    <div class="log" id="log"><div class="empty" id="empty">Stuck on a step? Pause and ask “why is it like that?”. The tutor sees exactly where you are in the video.</div></div>
    <div class="chips" id="chips">
      <button type="button">Why is it like that?</button>
      <button type="button">Can you explain it another way?</button>
      <button type="button">Show me with an example</button>
    </div>
    <form id="form"><textarea id="q" placeholder="Ask about this part of the video…" maxlength="1000"></textarea><button id="send">Ask</button></form>
  </aside>
</main>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const id=decodeURIComponent((location.pathname.match(/\/lesson\/([^\/?#]+)/)||[])[1]||new URLSearchParams(location.search).get('id')||'');
  const mmss=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
  let L=null,player=null,ready=false,history=[],busy=false,lastT=0;

  function token(){
    const raw=localStorage.getItem('solveit_auth');if(!raw)return'';
    try{const j=JSON.parse(raw);return j.token||j.studentToken||j.student_token||(typeof j==='string'?j:'');}catch(e){return raw;}
  }
  function now(){try{if(player&&ready)return player.getCurrentTime()||0;}catch(e){}return lastT;}
  function beatAt(t){if(!L)return null;let i=L.beats.findIndex(b=>t<b.end);if(i<0)i=L.beats.length-1;return L.beats[i];}
  function chapterAt(t){if(!L||!L.chapters)return null;let c=L.chapters[0];for(const x of L.chapters)if(t>=x.start)c=x;return c;}
  function seek(s){if(player&&ready){player.seekTo(s,true);player.playVideo();}}

  function showContext(paused){
    const t=now(),b=beatAt(t),c=chapterAt(t);
    document.querySelectorAll('.chap').forEach(el=>el.classList.toggle('on',c&&+el.dataset.s===c.start));
    $('#nowCh').textContent=c?('Now: '+c.name):'';
    if(paused&&b){$('#ctx').innerHTML='';const p=document.createElement('span');p.className='pill';p.textContent='Paused at '+mmss(t)+' · '+(b.chapter||b.title);$('#ctx').append(p,document.createTextNode(' Ask about this bit.'));}
  }

  function addMsg(role,text,opts={}){
    $('#empty')&&$('#empty').remove();
    const d=document.createElement('div');d.className='msg '+(role==='user'?'me':'bot')+(opts.err?' err':'');
    if(opts.at!=null){const a=document.createElement('span');a.className='at';a.textContent='at '+mmss(opts.at);d.append(a);}
    if(role==='user'){d.append(document.createTextNode(text));}
    else{
      const jumps=[];const clean=text.replace(/\[\[jump:(\d+(?:\.\d+)?)\]\]/g,(m,s)=>{jumps.push(+s);return'';}).replace(/[ \t]{2,}/g,' ').replace(/[ \t]+\n/g,'\n').trim();
      d.append(document.createTextNode(clean));
      [...new Set(jumps)].slice(0,3).forEach(s=>{const c=chapterAt(s),bt=document.createElement('button');bt.type='button';bt.className='jump';bt.textContent='▶ Rewatch '+(c?c.name+' ':'')+'('+mmss(s)+')';bt.onclick=()=>seek(s);d.append(document.createElement('br'),bt);});
      if(opts.cta){const w=document.createElement('div');w.className='cta';
        if(opts.cta==='login'){w.innerHTML='<a class="fill" href="/app">Log in</a><a href="/">Start free trial</a>';}
        else if(opts.cta==='subscription'){w.innerHTML='<a class="fill" href="/">Start the 7-day free trial</a>';}
        d.append(w);}
    }
    $('#log').append(d);$('#log').scrollTop=$('#log').scrollHeight;return d;
  }

  async function ask(text){
    text=(text||'').trim();if(!text||busy||!L)return;
    if(player&&ready){try{if(player.getPlayerState()===1)player.pauseVideo();}catch(e){}}
    const t=now();showContext(true);
    addMsg('user',text,{at:t});
    history.push({role:'user',content:'[Paused at '+mmss(t)+'] '+text});
    busy=true;$('#send').disabled=true;const typing=document.createElement('div');typing.className='typing';typing.textContent='Tutor is thinking…';$('#log').append(typing);$('#log').scrollTop=$('#log').scrollHeight;
    try{
      const r=await fetch('/api/tutor-lesson',{method:'POST',headers:{'content-type':'application/json','x-student-token':token()},body:JSON.stringify({lessonId:L.id,t,messages:history})});
      const j=await r.json().catch(()=>({}));typing.remove();
      if(!r.ok){history.pop();addMsg('assistant',j.reply||'Sorry, something went wrong. Try again.',{err:true,cta:(j.error==='login'||j.error==='subscription')?j.error:null});}
      else{history.push({role:'assistant',content:j.reply});addMsg('assistant',j.reply);}
    }catch(e){typing.remove();history.pop();addMsg('assistant','Couldn’t reach the tutor. Check your connection and try again.',{err:true});}
    busy=false;$('#send').disabled=false;
  }

  $('#form').addEventListener('submit',e=>{e.preventDefault();const v=$('#q').value;$('#q').value='';ask(v);});
  $('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form').requestSubmit();}});
  $('#q').addEventListener('focus',()=>{if(player&&ready){try{if(player.getPlayerState()===1){player.pauseVideo();}}catch(e){}}});
  $('#chips').addEventListener('click',e=>{if(e.target.tagName==='BUTTON')ask(e.target.textContent);});

  function notFound(){$('#main').innerHTML='<div class="notfound"><h1>Lesson not found</h1><p><a href="/">Back to Solve It</a></p></div>';}

  async function init(){
    if(!id)return notFound();
    let r;try{r=await fetch('/api/lessons/'+encodeURIComponent(id));}catch(e){return notFound();}
    if(!r.ok)return notFound();
    L=await r.json();
    document.title=L.title+' · Solve It';$('#title').textContent=L.title;$('#crumb').textContent='Video lessons · '+L.title;
    $('#practise').href='/app?topic='+encodeURIComponent(L.topic||'');
    const ch=$('#chapters');(L.chapters||[]).forEach(c=>{const b=document.createElement('button');b.type='button';b.className='chap';b.dataset.s=c.start;b.innerHTML='<span class="t"></span><span class="n"></span>';b.querySelector('.t').textContent=mmss(c.start);b.querySelector('.n').textContent=c.name;b.onclick=()=>seek(c.start);ch.append(b);});
    if(!L.youtubeId){$('.video').innerHTML='<div style="position:absolute;inset:0;display:grid;place-items:center;color:#cbd5e1;font-family:Work Sans,sans-serif">Video coming soon</div>';return;}
    const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.append(s);
  }
  window.onYouTubeIframeAPIReady=function(){
    player=new YT.Player('player',{host:'https://www.youtube-nocookie.com',videoId:L.youtubeId,
      playerVars:{rel:0,modestbranding:1,playsinline:1,cc_load_policy:0},
      events:{onReady:()=>{ready=true;showContext(false);},
        onStateChange:e=>{lastT=now();if(e.data===2)showContext(true);else if(e.data===1)showContext(false);}}});
    setInterval(()=>{if(ready&&player.getPlayerState&&player.getPlayerState()===1){lastT=now();showContext(false);}},1000);
  };
  init();
})();
</script>
</body>
</html>
