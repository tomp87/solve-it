  function updateFooter(){
    const p = progressCache[state.topic.id];
    els.streakLabel.textContent = 'Streak: ' + p.currentStreak + ' · Best: ' + p.bestStreak;
    els.score.textContent = p.correct + ' of ' + p.attempted + ' correct';
    renderDots();
  }

  async function mark(){
    const raw = els.answer.value;
    if(raw.trim() === ''){ els.answer.focus(); return; }
    const isCorrect = state.current.checkAnswer(raw);
    const p = progressCache[state.topic.id];

    p.attempted++;
    if(isCorrect){ p.correct++; p.currentStreak++; p.bestStreak = Math.max(p.bestStreak, p.currentStreak); }
    else { p.currentStreak = 0; }
    p.last = (p.last || []).concat([isCorrect]).slice(-8);

    els.verdict.textContent = isCorrect ? 'Correct!' : 'Not quite';
    els.verdict.className = 'verdict ' + (isCorrect ? 'correct' : 'incorrect');
    els.correctAnswer.textContent = isCorrect ? 'Nicely solved.' : 'The answer was ' + state.current.answerDisplay + '.';
    els.feedback.classList.add('show');

    els.answer.disabled = true;
    els.markBtn.disabled = true;
    els.workingBtn.disabled = false;
    updateFooter();

    try{
      await saveProgress(state.topic.id, String(state.level.id), isCorrect);
    } catch(e){
      // Non-fatal: the student can keep practising even if a save briefly fails
      // (e.g. a flaky connection); the next successful save carries the true totals.
      console.warn('Progress save failed:', e.message);
    }
  }

  function toggleWorking(){
    const showing = els.working.classList.contains('show');
    if(!showing){
      els.working.innerHTML = state.current.steps.map(s => '<p>' + s + '</p>').join('') + '<p class="result">Answer: ' + state.current.answerDisplay + '</p>';
      els.working.classList.add('show');
      els.workingBtn.textContent = 'Hide working';
    } else {
      els.working.classList.remove('show');
      els.workingBtn.textContent = 'Show working';
    }
  }

  // ============================================================
  // AI TUTOR — now via our own server (which holds the real API key),
  // instead of calling Anthropic directly from the browser.
  // ============================================================
  function appendTutorMessage(role, text){
    const emptyNote = els.tutorMessages.querySelector('.tutor-empty');
    if(emptyNote) emptyNote.remove();
    const div = document.createElement('div');
    div.className = 'tutor-msg ' + role;
    div.textContent = text;
    els.tutorMessages.appendChild(div);
    els.tutorMessages.scrollTop = els.tutorMessages.scrollHeight;
    return div;
  }

  async function sendTutorMessage(){
    const text = els.tutorInput.value.trim();
    if(!text) return;
    els.tutorInput.value = '';
    appendTutorMessage('user', text);
    state.chatHistory.push({ role: 'user', content: text });
    const loadingEl = appendTutorMessage('assistant', 'Thinking…');
    els.tutorSendBtn.disabled = true;
    try{
      const data = await apiFetch('/api/tutor', {
        method: 'POST',
        body: JSON.stringify({
          topicName: state.topic.name,
          levelLabel: state.level.label,
          questionPrompt: state.current.prompt,
          questionText: state.current.eqn || state.current.diagram && 'a diagram' || '',
          correctAnswer: state.current.answerDisplay,
          workedSteps: state.current.steps,
          messages: state.chatHistory
        })
      });
      loadingEl.textContent = data.reply;
      state.chatHistory.push({ role: 'assistant', content: data.reply });
    } catch(e){
      loadingEl.textContent = e.message || "Sorry, I couldn't reach the tutor just then. Try again in a moment.";
    } finally {
      els.tutorSendBtn.disabled = false;
      els.tutorInput.focus();
    }
  }

  els.backBtn.addEventListener('click', renderHome);
  els.markBtn.addEventListener('click', mark);
  els.nextBtn.addEventListener('click', newQuestion);
  els.workingBtn.addEventListener('click', toggleWorking);
  els.answer.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !els.markBtn.disabled) mark(); });

  els.tutorBtn.addEventListener('click', () => {
    els.tutorPanel.classList.toggle('hidden');
    const open = !els.tutorPanel.classList.contains('hidden');
    els.tutorBtn.textContent = open ? 'Hide help' : 'Ask for help';
    if(open) els.tutorInput.focus();
  });
  els.tutorSendBtn.addEventListener('click', sendTutorMessage);
  els.tutorInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendTutorMessage(); });

  els.resetBtn.addEventListener('click', async () => {
    if(!confirm('Reset all your progress? This can\'t be undone.')) return;
    try{
      await apiFetch('/api/progress/reset', { method: 'POST' });
      TOPICS.filter(t => !t.locked).forEach(t => { progressCache[t.id] = defaultProgress(); });
      renderHome();
    } catch(e){
      alert('Could not reset progress: ' + e.message);
    }
  });

  // ============================================================
  // LOGIN / SESSION
  // ============================================================
  function showLogin(){
    els.loginScreen.classList.remove('hidden');
    els.appScreen.classList.add('hidden');
  }
  async function showApp(){
    els.loginScreen.classList.add('hidden');
    els.appScreen.classList.remove('hidden');
    els.signedInLabel.textContent = studentName + ' · ' + className;
    els.loadingNote.classList.remove('hidden');
    els.topicGrid.classList.add('hidden');
    els.homeFooter.classList.add('hidden');
    try{
      await loadAllProgress();
      renderHome();
    } catch(e){
      // Token was probably invalid/expired server-side — send back to login.
      clearStoredAuth();
      showLogin();
      els.loginError.textContent = 'Your session expired — please join again.';
    }
  }

  els.joinBtn.addEventListener('click', async () => {
    const classCode = els.classCodeInput.value.trim().toUpperCase();
    const name = els.studentNameInput.value.trim();
    els.loginError.textContent = '';
    if(!classCode || !name){ els.loginError.textContent = 'Enter both a class code and your name.'; return; }
    els.joinBtn.disabled = true;
    try{
      const res = await fetch('/api/join', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ classCode, studentName: name })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Could not join class');
      studentToken = data.studentToken; studentName = data.studentName; className = data.className;
      setStoredAuth({ studentToken, studentName, className });
      await showApp();
    } catch(e){
      els.loginError.textContent = e.message;
    } finally {
      els.joinBtn.disabled = false;
    }
  });
  [els.classCodeInput, els.studentNameInput].forEach(input => {
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') els.joinBtn.click(); });
  });
  els.switchStudentBtn.addEventListener('click', () => {
    clearStoredAuth();
    studentToken = null;
    showLogin();
  });

  // ============================================================
  // THEME TOGGLE — light by default, dark chalkboard as an option.
  // Only affects the page chrome; the practice card is intentionally
  // pinned to dark chalkboard styling regardless (see CSS), since every
  // diagram's colours are tuned for that background.
  // ============================================================
  const THEME_KEY = 'solveit_theme';
  const themeToggleBtn = document.getElementById('themeToggle');
  function applyTheme(theme){
    if(theme === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      themeToggleBtn.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      themeToggleBtn.textContent = '🌙';
    }
  }
  function initTheme(){
    let saved = null;
    try{ saved = localStorage.getItem(THEME_KEY); } catch(e){ /* localStorage unavailable — fall back to light */ }
    applyTheme(saved === 'dark' ? 'dark' : 'light');
  }
  themeToggleBtn.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); } catch(e){ /* not fatal — theme just won't persist */ }
  });
  initTheme();

  (function init(){
    const saved = getStoredAuth();
    if(saved && saved.studentToken){
      studentToken = saved.studentToken; studentName = saved.studentName; className = saved.className;
      showApp();
    } else {
      showLogin();
    }
  })();

})();
</script>
</body>
</html>
