<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solve It — GCSE Maths Practice</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Literata:ital,wght@0,500;1,500;0,600&family=Work+Sans:wght@400;500;600;700&display=swap');

  :root{
    --ink-rgb: 43,36,24;
    --chalk-bg-1: #faf6ed;
    --chalk-bg-2: #f2ead8;
    --panel: #fffdf8;
    --panel-edge: rgba(var(--ink-rgb),0.14);
    --chalk-white: #2b2418;
    --chalk-dim: rgba(var(--ink-rgb),0.62);
    --chalk-faint: rgba(var(--ink-rgb),0.32);
    --chalk-yellow: #b5651d;
    --chalk-green: #1f7a52;
    --chalk-coral: #b23b2e;
    --accent-ink: #fffaf0;
  }
  [data-theme="dark"]{
    --ink-rgb: 241,237,225;
    --chalk-bg-1: #14231b;
    --chalk-bg-2: #1d3327;
    --panel: #223a2c;
    --chalk-white: #f1ede1;
    --chalk-yellow: #e8c468;
    --chalk-green: #9fd8a6;
    --chalk-coral: #e2897b;
    --accent-ink: #1d2a1f;
  }
  /* The practice card is a fixed "chalkboard" workspace — it stays dark
     regardless of the page theme, because every diagram's colours are
     tuned for a dark background. This keeps 90+ already-verified
     generators completely untouched by the theme toggle. */
  .card{
    --ink-rgb: 241,237,225;
    --panel: #223a2c;
    --panel-edge: rgba(241,237,225,0.14);
    --chalk-white: #f1ede1;
    --chalk-dim: rgba(241,237,225,0.62);
    --chalk-faint: rgba(241,237,225,0.32);
    --chalk-yellow: #e8c468;
    --chalk-green: #9fd8a6;
    --chalk-coral: #e2897b;
    --accent-ink: #1d2a1f;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; min-height:100%; background: radial-gradient(ellipse at 20% 0%, var(--chalk-bg-2) 0%, var(--chalk-bg-1) 60%); color: var(--chalk-white); font-family:'Work Sans', sans-serif; }
  body{ padding: 48px 20px 64px; display:flex; flex-direction:column; align-items:center; }
  .wrap{ width:100%; max-width: 640px; }
  header{ text-align:center; margin-bottom: 30px; }
  h1{ font-family:'Caveat', cursive; font-weight:700; font-size:3.2rem; line-height:1; margin:0 0 6px; color:var(--chalk-yellow); }
  .subtitle{ color: var(--chalk-dim); font-size:0.95rem; margin:0; }

  .topic-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap:14px; }
  .topic-card{ background: var(--panel); border:1px solid var(--panel-edge); border-radius:12px; padding:20px 20px 18px; text-align:left; cursor:pointer; transition: border-color .15s ease, transform .08s ease; position:relative; }
  .topic-card.mastered{ border-color: rgba(159,216,166,0.5); }
  .mastery-badge{ display:inline-block; font-size:0.66rem; font-weight:600; padding:2px 8px; border-radius:999px; margin-bottom:8px; }
  .mastery-badge.mastered{ background: rgba(159,216,166,0.15); color: var(--chalk-green); }
  .mastery-badge.practicing{ background: rgba(232,196,104,0.12); color: var(--chalk-yellow); }
  .mastery-summary{ max-width: 340px; margin: 0 auto 22px; text-align:center; }
  .mastery-summary-text{ font-size:0.82rem; color: var(--chalk-dim); margin-bottom:8px; }
  .mastery-summary-bar{ height:6px; border-radius:999px; background: var(--panel-edge); overflow:hidden; }
  .mastery-summary-fill{ height:100%; background: var(--chalk-green); border-radius:999px; transition: width .3s ease; }
  .topic-card:hover{ border-color: rgba(232,196,104,0.5); transform: translateY(-2px); }
  .topic-card h2{ font-family:'Work Sans', sans-serif; font-size:1.0rem; font-weight:600; margin:0 0 5px; color: var(--chalk-white); }
  .topic-card p.tag{ color: var(--chalk-dim); font-size:0.78rem; margin:0 0 12px; }
  .topic-card .example{ font-family:'Literata', serif; font-style:italic; font-size:1.05rem; color: var(--chalk-yellow); margin-bottom: 10px; }
  .topic-card .progress-line{ font-size:0.7rem; color: var(--chalk-faint); border-top: 1px dashed var(--panel-edge); padding-top:8px; margin-top:2px; }
  .topic-card.locked{ cursor:default; opacity:0.5; }
  .topic-card.locked:hover{ transform:none; border-color: var(--panel-edge); }
  .topic-card.locked .example{ color: var(--chalk-faint); }
  .coming-soon-tag{ display:inline-block; font-size:0.7rem; color: var(--chalk-faint); border:1px solid var(--panel-edge); border-radius:999px; padding:2px 9px; margin-bottom: 10px; }

  .home-footer{ text-align:center; margin-top: 22px; }
  .reset-link{ background:none; border:none; color: var(--chalk-faint); font-size:0.75rem; cursor:pointer; text-decoration: underline; padding:0; }
  .reset-link:hover{ color: var(--chalk-dim); }
  .loading-note{ text-align:center; color: var(--chalk-faint); font-size:0.85rem; padding: 30px 0; }

  .back-link{ background:none; border:none; color: var(--chalk-dim); font-family:'Work Sans', sans-serif; font-size:0.85rem; cursor:pointer; margin-bottom:16px; padding:0; }
  .back-link:hover{ color: var(--chalk-white); }
  .topic-title{ font-family:'Caveat', cursive; font-weight:700; font-size:2rem; color: var(--chalk-yellow); margin:0 0 6px; text-align:center; }
  .topic-sub{ text-align:center; color: var(--chalk-faint); font-size: 0.78rem; margin: 0 0 16px; }
  .tabs{ display:flex; gap:8px; justify-content:center; margin-bottom:22px; flex-wrap:wrap; }
  .tab{ background:transparent; border:1px solid var(--panel-edge); color: var(--chalk-dim); padding:8px 16px; border-radius:999px; font-size:0.85rem; font-weight:500; cursor:pointer; transition: border-color .15s ease, color .15s ease, background .15s ease; }
  .tab:hover{ border-color: rgba(var(--ink-rgb),0.35); color: var(--chalk-white); }
  .tab.active{ background: var(--chalk-yellow); border-color: var(--chalk-yellow); color:var(--accent-ink); font-weight:600; }

  .card{ background: var(--panel); border:1px solid var(--panel-edge); border-radius:14px; padding:34px 30px 28px; position:relative; box-shadow: 0 24px 60px -30px rgba(0,0,0,0.65); }
  .card::before{ content:""; position:absolute; top:14px; left:14px; right:14px; bottom:14px; border:1px dashed rgba(var(--ink-rgb),0.10); border-radius:8px; pointer-events:none; }

  .instruction{ text-align:center; color: var(--chalk-dim); font-size:0.85rem; margin:0 0 4px; }
  .equation{ font-family:'Literata', serif; font-style:italic; font-weight:500; text-align:center; font-size:1.65rem; color: var(--chalk-white); margin:10px 0 26px; white-space: pre-line; line-height:1.5; }

  .diagram-area{ display:flex; justify-content:center; margin: 6px 0 4px; }
  .diagram-caption{ text-align:center; color: var(--chalk-faint); font-size:0.72rem; font-style:italic; margin: 0 0 18px; }

  .answer-row{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px; flex-wrap: wrap; }
  .answer-row label{ font-family:'Literata', serif; font-style:italic; font-size:1.1rem; color: var(--chalk-dim); min-height: 1px; }
  .answer-row input{ width: 240px; background: rgba(var(--ink-rgb),0.06); border:1px solid var(--panel-edge); border-radius:8px; color: var(--chalk-white); font-family:'Literata', serif; font-size:1.05rem; padding:9px 12px; text-align:center; outline:none; transition: border-color .15s ease; }
  .answer-row input:focus{ border-color: var(--chalk-yellow); }
  .hint{ text-align:center; color: var(--chalk-faint); font-size:0.75rem; margin:0 0 20px; }

  .actions{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  button.primary, button.secondary{ font-family:'Work Sans', sans-serif; font-weight:600; font-size:0.85rem; padding:10px 18px; border-radius:8px; cursor:pointer; border:1px solid transparent; transition: transform .08s ease, background .15s ease, border-color .15s ease; }
  button.primary{ background: var(--chalk-yellow); color:var(--accent-ink); }
  button.primary:hover{ transform: translateY(-1px); }
  button.primary:disabled{ opacity:0.45; cursor:default; transform:none; }
  button.secondary{ background:transparent; border-color: var(--panel-edge); color: var(--chalk-dim); }
  button.secondary:hover{ border-color: rgba(var(--ink-rgb),0.4); color: var(--chalk-white); }

  .tutor-panel{ margin-top:20px; padding-top:18px; border-top:1px dashed var(--panel-edge); }
  .tutor-messages{ max-height:230px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:10px; padding-right:2px; }
  .tutor-msg{ font-size:0.85rem; line-height:1.45; padding:8px 12px; border-radius:10px; max-width:88%; }
  .tutor-msg.user{ align-self:flex-end; background: rgba(var(--ink-rgb),0.10); color: var(--chalk-white); }
  .tutor-msg.assistant{ align-self:flex-start; background: rgba(0,0,0,0.18); border-left:2px solid var(--chalk-yellow); color: var(--chalk-dim); }
  .tutor-empty{ text-align:center; color: var(--chalk-faint); font-size:0.78rem; padding: 6px 0 12px; }
  .tutor-input-row{ display:flex; gap:8px; }
  .tutor-input-row input{ flex:1; background: rgba(var(--ink-rgb),0.06); border:1px solid var(--panel-edge); border-radius:8px; color: var(--chalk-white); font-family:'Work Sans', sans-serif; font-size:0.85rem; padding:9px 12px; outline:none; transition: border-color .15s ease; }
  .tutor-input-row input:focus{ border-color: var(--chalk-yellow); }

  .feedback{ margin-top:22px; padding-top:20px; border-top:1px dashed var(--panel-edge); display:none; }
  .feedback.show{ display:block; }
  .verdict{ font-family:'Caveat', cursive; font-size:2rem; font-weight:700; text-align:center; margin:0 0 4px; }
  .verdict.correct{ color: var(--chalk-green); }
  .verdict.incorrect{ color: var(--chalk-coral); }
  .correct-answer{ text-align:center; color: var(--chalk-dim); font-size:0.88rem; margin-bottom:14px; }

  .working{ display:none; background: rgba(0,0,0,0.18); border-radius:8px; padding:14px 18px; margin-top:12px; }
  .working.show{ display:block; }
  .working p{ font-family:'Literata', serif; font-style:italic; font-size:0.92rem; color: var(--chalk-dim); margin:5px 0; }
  .working p.result{ color: var(--chalk-yellow); font-style:normal; font-weight:600; }

  footer{ display:flex; align-items:center; justify-content:space-between; margin-top:22px; padding:0 4px; flex-wrap: wrap; gap: 8px;}
  .streak{ display:flex; align-items:center; gap:8px; color: var(--chalk-dim); font-size:0.82rem; }
  .dots{ display:flex; gap:4px; }
  .dot{ width:9px; height:9px; border-radius:50%; background: rgba(var(--ink-rgb),0.18); }
  .dot.correct{ background: var(--chalk-green); }
  .dot.incorrect{ background: var(--chalk-coral); }
  .score{ color: var(--chalk-faint); font-size:0.78rem; }

  .hidden{ display:none !important; }

  .login-wrap{ display:flex; align-items:center; justify-content:center; min-height: 70vh; }
  .login-card{ background: var(--panel); border:1px solid var(--panel-edge); border-radius:14px; padding:34px 30px; width:100%; max-width:380px; box-shadow: 0 24px 60px -30px rgba(0,0,0,0.65); }
  .login-card h2{ font-family:'Caveat', cursive; font-size:1.9rem; color: var(--chalk-yellow); margin:0 0 4px; text-align:center; }
  .login-sub{ text-align:center; color: var(--chalk-dim); font-size:0.85rem; margin:0 0 22px; }
  .login-field{ margin-bottom: 14px; }
  .login-field label{ display:block; font-size:0.78rem; color: var(--chalk-dim); margin-bottom:5px; }
  .login-field input{ width:100%; background: rgba(var(--ink-rgb),0.06); border:1px solid var(--panel-edge); border-radius:8px; color: var(--chalk-white); font-family:'Work Sans', sans-serif; font-size:0.95rem; padding:10px 12px; outline:none; transition: border-color .15s ease; }
  .login-field input:focus{ border-color: var(--chalk-yellow); }
  .login-error{ color: var(--chalk-coral); font-size:0.8rem; text-align:center; margin: 8px 0 0; min-height: 1em; }
  .login-submit{ width:100%; margin-top:6px; }
  .signed-in-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; font-size:0.78rem; color: var(--chalk-faint); }
  .signed-in-bar button{ background:none; border:none; color: var(--chalk-faint); text-decoration: underline; cursor:pointer; font-size:0.78rem; padding:0; }
  .signed-in-bar button:hover{ color: var(--chalk-dim); }

  header{ position: relative; }
  .theme-toggle{
    position: absolute; top: 4px; right: 4px;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 999px;
    width: 38px; height: 38px; font-size: 1.05rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease, border-color .15s ease;
  }
  .theme-toggle:hover{ transform: scale(1.06); border-color: rgba(var(--ink-rgb),0.3); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    <h1>Solve It</h1>
    <p class="subtitle">GCSE Maths practice, remade every time</p>
  </header>

  <div id="loginScreen">
    <div class="login-wrap">
      <div class="login-card">
        <h2>Join your class</h2>
        <p class="login-sub">Ask your teacher or parent for the class code</p>
        <div class="login-field">
          <label for="classCodeInput">Class code</label>
          <input type="text" id="classCodeInput" placeholder="e.g. K7X9QT" autocomplete="off" style="text-transform:uppercase;" maxlength="6" />
        </div>
        <div class="login-field">
          <label for="studentNameInput">Your first name</label>
          <input type="text" id="studentNameInput" placeholder="e.g. Alex" autocomplete="off" maxlength="40" />
        </div>
        <button class="primary login-submit" id="joinBtn">Join class</button>
        <p class="login-error" id="loginError"></p>
      </div>
    </div>
  </div>

  <div id="appScreen" class="hidden">
    <div class="signed-in-bar">
      <span id="signedInLabel"></span>
      <button id="switchStudentBtn">Not you? Switch student</button>
    </div>
  <div id="homeScreen">
    <p class="loading-note" id="loadingNote">Loading your progress…</p>
    <div class="mastery-summary hidden" id="masterySummary"></div>
    <div class="topic-grid hidden" id="topicGrid"></div>
    <div class="home-footer hidden" id="homeFooter">
      <button class="reset-link" id="resetBtn">Reset all progress</button>
    </div>
  </div>

  <div id="practiceScreen" class="hidden">
    <button class="back-link" id="backBtn">← All topics</button>
    <p class="topic-title" id="topicTitle"></p>
    <p class="topic-sub" id="topicSub"></p>
    <div class="tabs" id="tabs"></div>

    <div class="card">
      <p class="instruction" id="promptText"></p>
      <div class="diagram-area hidden" id="diagramArea"></div>
      <p class="diagram-caption hidden" id="diagramCaption">Diagram not to scale</p>
      <p class="equation" id="equation"></p>
      <div class="answer-row">
        <label for="answer" id="answerLabel"></label>
        <input type="text" id="answer" placeholder="" autocomplete="off" />
      </div>
      <p class="hint" id="hintText"></p>
      <div class="actions">
        <button class="primary" id="markBtn">Mark it</button>
        <button class="secondary" id="nextBtn">New question</button>
        <button class="secondary" id="workingBtn" disabled>Show working</button>
        <button class="secondary" id="tutorBtn">Ask for help</button>
      </div>

      <div class="tutor-panel hidden" id="tutorPanel">
        <div class="tutor-messages" id="tutorMessages">
          <p class="tutor-empty" id="tutorEmpty">Stuck, or just want a hint? Ask Claude about this question.</p>
        </div>
        <div class="tutor-input-row">
          <input type="text" id="tutorInput" placeholder="e.g. I don't know where to start" autocomplete="off" />
          <button class="primary" id="tutorSendBtn">Send</button>
        </div>
      </div>

      <div class="feedback" id="feedback">
        <p class="verdict" id="verdict"></p>
        <p class="correct-answer" id="correctAnswer"></p>
        <div class="working" id="working"></div>
      </div>
    </div>

    <footer>
      <div class="streak">
        <span id="streakLabel">Streak: 0</span>
        <div class="dots" id="dots"></div>
      </div>
      <div class="score" id="score">0 of 0 correct</div>
    </footer>
  </div>
  </div>
</div>

<script>
(function(){

  function tokenizeExpr(str){
    const s = str.replace(/\s+/g, '');
    const raw = [];
    let i = 0;
    while(i < s.length){
      const c = s[i];
      if(/[0-9.]/.test(c)){
        let j = i + 1;
        while(j < s.length && /[0-9.]/.test(s[j])) j++;
        const val = parseFloat(s.slice(i, j));
        if(isNaN(val)) throw new Error('bad number');
        raw.push({ type: 'num', value: val });
        i = j;
      } else if(/[a-zA-Z]/.test(c)){
        raw.push({ type: 'var', value: c.toLowerCase() });
        i++;
      } else if('+-*/^()'.includes(c)){
        raw.push({ type: c });
        i++;
      } else {
        throw new Error('unexpected character: ' + c);
      }
    }
    const tokens = [];
    for(let k = 0; k < raw.length; k++){
      tokens.push(raw[k]);
      const cur = raw[k], nxt = raw[k + 1];
      if(nxt){
        const curEndsValue = (cur.type === 'num' || cur.type === 'var' || cur.type === ')');
        const nxtStartsValue = (nxt.type === 'num' || nxt.type === 'var' || nxt.type === '(');
        if(curEndsValue && nxtStartsValue) tokens.push({ type: '*' });
      }
    }
    return tokens;
  }

  function evalExpr(str, vars){
    const tokens = tokenizeExpr(str);
    let pos = 0;
    const peek = () => tokens[pos];
    const consume = () => tokens[pos++];
    function parseExpr(){
      let val = parseTerm();
      while(peek() && (peek().type === '+' || peek().type === '-')){
        const op = consume().type;
        const rhs = parseTerm();
        val = op === '+' ? val + rhs : val - rhs;
      }
      return val;
    }
    function parseTerm(){
      let val = parseUnary();
      while(peek() && (peek().type === '*' || peek().type === '/')){
        const op = consume().type;
        const rhs = parseUnary();
        if(op === '/'){ if(rhs === 0) throw new Error('division by zero'); val = val / rhs; }
        else val = val * rhs;
      }
      return val;
    }
    function parseUnary(){
      if(peek() && peek().type === '-'){ consume(); return -parseUnary(); }
      if(peek() && peek().type === '+'){ consume(); return parseUnary(); }
      return parsePow();
    }
    function parsePow(){
      let base = parsePrimary();
      if(peek() && peek().type === '^'){
        consume();
        const exp = parseUnary();
        base = Math.pow(base, exp);
      }
      return base;
    }
    function parsePrimary(){
      const t = peek();
      if(!t) throw new Error('unexpected end of expression');
      if(t.type === 'num'){ consume(); return t.value; }
      if(t.type === 'var'){
        consume();
        if(!(t.value in vars)) throw new Error('unknown variable: ' + t.value);
        return vars[t.value];
      }
      if(t.type === '('){
        consume();
        const val = parseExpr();
        if(!peek() || peek().type !== ')') throw new Error('expected closing bracket');
        consume();
        return val;
      }
      throw new Error('unexpected token');
    }
    const result = parseExpr();
    if(pos !== tokens.length) throw new Error('unexpected trailing input');
    return result;
  }

  // ============================================================
  // SHARED FORMATTING + CHECKER HELPERS
  // ============================================================
  function gcd(a, b){ a = Math.abs(a); b = Math.abs(b); while(b){ [a, b] = [b, a % b]; } return a || 1; }
  function fmtAdd(n, letter){ letter = letter || ''; return (n >= 0 ? ' + ' : ' - ') + Math.abs(n) + letter; }
  function fmtTermSigned(coef, letter){
    const mag = Math.abs(coef) === 1 ? letter : Math.abs(coef) + letter;
    return (coef >= 0 ? ' + ' : ' - ') + mag;
  }
  function fmtCoefX(a){ if(a === 1) return 'x'; if(a === -1) return '-x'; return a + 'x'; }
  function fmtCoefPow(a, base){ if(a === 1) return base; if(a === -1) return '-' + base; return a + base; }
  function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
  function randNonZero(min, max){ let v = 0; while(v === 0) v = randInt(min, max); return v; }
  function fmtFraction(num, den){
    const g = gcd(num, den);
    let n = num / g, d = den / g;
    if(d < 0){ d = -d; n = -n; }
    return d === 1 ? String(n) : n + '/' + d;
  }
  function fmtLinearExpr(coef, konst, letter){
    letter = letter || 'x';
    let s;
    if(coef === 0) s = '';
    else if(coef === 1) s = letter;
    else if(coef === -1) s = '-' + letter;
    else s = coef + letter;
    if(konst !== 0){ s = s === '' ? String(konst) : s + fmtAdd(konst); }
    return s === '' ? '0' : s;
  }
  function fmtQuadraticExpr(b, c){
    const bStr = b === 0 ? '' : (b >= 0 ? ' + ' + b + 'x' : ' - ' + Math.abs(b) + 'x');
    const cStr = c === 0 ? '' : (c >= 0 ? ' + ' + c : ' - ' + Math.abs(c));
    return 'x²' + bStr + cStr;
  }
  function toSuperscript(n){
    const map = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻' };
    return String(n).split('').map(ch => map[ch] || ch).join('');
  }
  function fmtPower(k){ if(k === 0) return '1'; if(k === 1) return 'x'; return 'x' + toSuperscript(k); }
  function ordinalSuffixSimple(n){ return n === 1 ? 'st' : n === 2 ? 'nd' : 'rd'; }

  function numericChecker(answerValue, tolerance){
    tolerance = tolerance || 1e-6;
    return function(raw){
      const s = raw.trim();
      if(s === '') return false;
      let val;
      if(s.includes('/')){
        const parts = s.split('/');
        if(parts.length !== 2) return false;
        const n = parseFloat(parts[0]), d = parseFloat(parts[1]);
        if(isNaN(n) || isNaN(d) || d === 0) return false;
        val = n / d;
      } else {
        val = parseFloat(s);
      }
      return !isNaN(val) && Math.abs(val - answerValue) < tolerance;
    };
  }

  function coordChecker(px, py){
    return function(raw){
      const nums = (raw.match(/-?\d+(\.\d+)?/g) || []).map(Number);

  // ---- Shared geometry helpers for SVG diagrams ----
  // toXY/describeArc/degBetween/arcBisectorDeg all use one consistent
  // convention: standard screen pixel space (0deg = right, angle grows
  // clockwise because y grows downward). Keeping every diagram builder
  // on this single convention avoids the sign errors that come from
  // mixing "maths up" and "screen down" angle systems.
  function toXY(cx, cy, r, deg){ const rad = deg * Math.PI / 180; return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)]; }
  function degBetween(x1, y1, x2, y2){ return Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI; }
  function arcBisectorDeg(deg1, deg2){
    let diff = deg2 - deg1;
    while(diff > 180) diff -= 360;
    while(diff < -180) diff += 360;
    return deg1 + diff / 2;
  }
  function describeArc(cx, cy, r, deg1, deg2, steps, forceLong){
    let diff = deg2 - deg1;
    while(diff > 180) diff -= 360;
    while(diff < -180) diff += 360;
    if(forceLong) diff = diff >= 0 ? diff - 360 : diff + 360;
    const pts = [];
    for(let i = 0; i <= steps; i++){
      const t = (deg1 + diff * (i / steps)) * Math.PI / 180;
      pts.push((cx + r * Math.cos(t)).toFixed(1) + ',' + (cy + r * Math.sin(t)).toFixed(1));
    }
    return pts.join(' ');
  }
  // Always sweeps in the increasing/clockwise direction from deg1 to deg2, regardless
  // of which way is "shorter" — needed for bearings, where the angle IS defined as
  // that specific clockwise measurement, even when it's the long way round.
  function describeArcClockwise(cx, cy, r, deg1, deg2, steps){
    let diff = deg2 - deg1;
    while(diff < 0) diff += 360;
    const pts = [];
    for(let i = 0; i <= steps; i++){
      const t = (deg1 + diff * (i / steps)) * Math.PI / 180;
      pts.push((cx + r * Math.cos(t)).toFixed(1) + ',' + (cy + r * Math.sin(t)).toFixed(1));
    }
    return pts.join(' ');
  }
  function arcBisectorClockwise(deg1, deg2){ let diff = deg2 - deg1; while(diff < 0) diff += 360; return deg1 + diff / 2; }
  function round1dp(v){ return Math.round(v * 10) / 10; }
  function round2dp(v){ return Math.round(v * 100) / 100; }

  function numericEquivChecker(varNames, expectedFn, opts){
    opts = opts || {};
    const trials = opts.trials || 4;
    const genVal = opts.genVal || (() => randInt(2, 9));
    return function(raw){
      if(!raw || !raw.trim()) return false;
      for(let t = 0; t < trials; t++){
        const vars = {};
        varNames.forEach(v => { vars[v] = genVal(); });
        let expected, got;
        try{
          expected = expectedFn(vars);
          got = evalExpr(raw, vars);
        } catch(e){ return false; }
        if(typeof got !== 'number' || !isFinite(got)) return false;
        if(Math.abs(got - expected) > 1e-6) return false;
      }
      return true;
    };
  }

  function factorChecker(p, q){
    const target = [p, q].sort((x, y) => x - y).join(',');
    return function(raw){
      const s = raw.replace(/\s+/g, '').toLowerCase();
      const m = s.match(/^\(x([+-]\d+)\)\(x([+-]\d+)\)$/);
      if(!m) return false;
      const got = [parseInt(m[1], 10), parseInt(m[2], 10)].sort((x, y) => x - y).join(',');
      return got === target;
    };
  }

  function parseStandardForm(raw){
    const s = raw.replace(/\s+/g, '').toLowerCase();
    let m = s.match(/^(-?\d+(\.\d+)?)[x×*]10\^(-?\d+)$/);
    if(!m) m = s.match(/^(-?\d+(\.\d+)?)e(-?\d+)$/);

  function stdFormChecker(value){
    return function(raw){
      const parsed = parseStandardForm(raw);
      if(!parsed) return false;
      if(Math.abs(parsed.mantissa) < 1 || Math.abs(parsed.mantissa) >= 10) return false;
      const recon = parsed.mantissa * Math.pow(10, parsed.exponent);
      return Math.abs(recon - value) < Math.abs(value) * 1e-9 + 1e-9;
    };

  function roundToSigFigs(value, sf){
    if(value === 0) return 0;

    return Math.round(value * factor) / factor;
  }

  function buildTriangleSVG(labels){
    const P = { A: [55, 215], B: [265, 215], C: [150, 45] };
    const centroid = [(P.A[0] + P.B[0] + P.C[0]) / 3, (P.A[1] + P.B[1] + P.C[1]) / 3];
    const mid = { a: [(P.B[0] + P.C[0]) / 2, (P.B[1] + P.C[1]) / 2], b: [(P.A[0] + P.C[0]) / 2, (P.A[1] + P.C[1]) / 2], c: [(P.A[0] + P.B[0]) / 2, (P.A[1] + P.B[1]) / 2] };
    const vLabelPos = (v) => [v[0] + (centroid[0] - v[0]) * 0.32, v[1] + (centroid[1] - v[1]) * 0.32];
    const sLabelPos = (m) => [m[0] + (m[0] - centroid[0]) * 0.32, m[1] + (m[1] - centroid[1]) * 0.32];
    const col = (l) => (l && l.color) || '#f1ede1';
    let out = '<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:300px;height:auto;display:block;">' +
      '<polygon points="' + P.A.join(',') + ' ' + P.B.join(',') + ' ' + P.C.join(',') + '" fill="rgba(232,196,104,0.10)" stroke="#f1ede1" stroke-width="2" stroke-linejoin="round"/>';
    ['A', 'B', 'C'].forEach(k => {
      if(labels[k]){ const [x, y] = vLabelPos(P[k]); out += '<text x="' + x + '" y="' + y + '" fill="' + col(labels[k]) + '" font-size="14" font-family="Literata, serif" font-style="italic" text-anchor="middle">' + labels[k].text + '</text>'; }
    });
    ['a', 'b', 'c'].forEach(k => {
      if(labels[k]){ const [x, y] = sLabelPos(mid[k]); out += '<text x="' + x + '" y="' + y + '" fill="' + col(labels[k]) + '" font-size="13" font-family="Literata, serif" font-style="italic" text-anchor="middle">' + labels[k].text + '</text>'; }
    });
    return out + '</svg>';
  }
  function genSineRule1(){

  function isSquareFree(n){ for(let i = 2; i * i <= n; i++){ if(n % (i * i) === 0) return false; } return true; }
  const SQUAREFREE_POOL = [2, 3, 5, 6, 7, 10, 11, 13, 14, 15];
  function parseSurd(raw){
    const s = raw.replace(/\s+/g, '').toLowerCase();
    const m = s.match(/^(-?\d*)(?:√|sqrt)\(?(\d+)\)?$/);
    if(!m) return null;
    const coefStr = m[1];
    const coef = coefStr === '' ? 1 : coefStr === '-' ? -1 : parseInt(coefStr, 10);
    return { coef, radicand: parseInt(m[2], 10) };
  }
  function surdChecker(expCoef, expRadicand){
    return function(raw){
      const p = parseSurd(raw);
      if(!p) return false;

    };
  }
  function simplifySurd(value){
    // returns [coef, radicand] such that coef * sqrt(radicand) === sqrt(value), radicand squarefree
    let coef = 1, radicand = value;
    for(let f = 2; f * f <= radicand; f++){
      while(radicand % (f * f) === 0){ radicand /= (f * f); coef *= f; }
    }
    return [coef, radicand];
  }

    const squarefree = SQUAREFREE_POOL[randInt(0, SQUAREFREE_POOL.length - 1)];

      eqn: '√' + value, answerDisplay: (s === 1 ? '' : s) + '√' + squarefree, checkAnswer: surdChecker(s, squarefree),
      steps: [ 'Find the largest square factor of ' + value + ': that\'s ' + (s * s),
        '√' + value + ' = √' + (s * s) + ' × √' + squarefree + ' = ' + s + '√' + squarefree ] };
  }
  function genSurds2(){
    const p = randInt(2, 10), q = randInt(2, 10);

    return { prompt: 'Simplify', answerLabel: '=', hint: 'Type your answer like 6√2 (or just a whole number if it simplifies fully)',
      eqn: '√' + p + ' × √' + q, answerDisplay: radicand === 1 ? String(coef) : (coef === 1 ? '' : coef) + '√' + radicand,
      checkAnswer: radicand === 1 ? numericChecker(coef) : surdChecker(coef, radicand),
      steps: [ '√' + p + ' × √' + q + ' = √' + product,
        radicand === 1 ? '√' + product + ' = ' + coef + '   (a perfect square)' : '√' + product + ' = ' + coef + '√' + radicand ] };

  function parseSurdFraction(raw){
    const s = raw.replace(/\s+/g, '').toLowerCase();
    const m = s.match(/^(-?\d*)(?:√|sqrt)\(?(\d+)\)?\/(\d+)$/);
    if(!m) return null;
    const coefStr = m[1];
    const coef = coefStr === '' ? 1 : coefStr === '-' ? -1 : parseInt(coefStr, 10);
    return { coef, radicand: parseInt(m[2], 10), denom: parseInt(m[3], 10) };
  }
  function surdFractionChecker(expCoef, expRadicand, expDenom){
    return function(raw){
      const p = parseSurdFraction(raw);
      if(!p) return false;
      return p.coef === expCoef && p.radicand === expRadicand && p.denom === expDenom;
    };
  }

  function genHistClasses(){
    const widthPool = [5, 10, 15, 20];
    let lower = 0;

  function genHistogram1(){
    const classes = genHistClasses();
    const idx = randInt(0, 3);
    const c = classes[idx];

    return { prompt: 'Work out the frequency density for the "' + c.lower + '–' + c.upper + '" class', answerLabel: '=', hint: 'Give your answer as a number',
      eqn: tableText, answerDisplay: String(c.fd), checkAnswer: numericChecker(c.fd, 0.03),
      steps: [ 'Frequency density = frequency ÷ class width', '= ' + c.freq + ' ÷ ' + c.width + ' = ' + c.fd ] };
  }

  function buildHistogramSVG(classes, highlightIdx){
    const x0data = classes[0].lower, x1data = classes[classes.length - 1].upper;
    const totalWidth = x1data - x0data;
    const maxFD = Math.max(...classes.map(c => c.fd));
    const width = 340, height = 230;
    const padL = 20, padB = 30, padT = 14, padR = 14;
    const plotW = width - padL - padR, plotH = height - padT - padB;
    const xScale = plotW / totalWidth, yScale = plotH / (maxFD * 1.2);
    const toPxX = (v) => padL + (v - x0data) * xScale;
    let bars = '', xLabels = '';
    classes.forEach((c, i) => {
      const bx = toPxX(c.lower), bw = (c.upper - c.lower) * xScale, bh = c.fd * yScale;
      const by = padT + plotH - bh;
      const isHi = i === highlightIdx;
      bars += '<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" fill="' + (isHi ? 'rgba(232,196,104,0.35)' : 'rgba(232,196,104,0.12)') + '" stroke="#f1ede1" stroke-width="1.5"/>';
      bars += '<text x="' + (bx + bw / 2) + '" y="' + (by - 6) + '" fill="' + (isHi ? '#e8c468' : 'rgba(var(--ink-rgb),0.7)') + '" font-size="11" font-family="Literata, serif" font-style="italic" text-anchor="middle">' + c.fd + '</text>';
    });
    classes.forEach((c) => { xLabels += '<text x="' + toPxX(c.lower) + '" y="' + (padT + plotH + 16) + '" fill="rgba(var(--ink-rgb),0.6)" font-size="10" font-family="Work Sans, sans-serif" text-anchor="middle">' + c.lower + '</text>'; });
    xLabels += '<text x="' + toPxX(x1data) + '" y="' + (padT + plotH + 16) + '" fill="rgba(var(--ink-rgb),0.6)" font-size="10" font-family="Work Sans, sans-serif" text-anchor="middle">' + x1data + '</text>';
    return '<svg viewBox="0 0 ' + width + ' ' + height + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:340px;height:auto;display:block;">' +
      '<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (padL + plotW) + '" y2="' + (padT + plotH) + '" stroke="#f1ede1" stroke-width="1.5"/>' +
      bars + xLabels +
      '<text x="' + (padL + plotW / 2) + '" y="' + (height - 4) + '" fill="rgba(var(--ink-rgb),0.45)" font-size="10" font-family="Work Sans, sans-serif" text-anchor="middle">frequency density shown above each bar</text>' +
      '</svg>';
  }

    const classes = genHistClasses();

  }

  // ============================================================
  // TOPIC: SIMULTANEOUS EQUATIONS
  // ============================================================
  function genSimultaneous(range){
    let a, b, c, d;
    do{
      a = randNonZero(-range, range); b = randNonZero(-range, range);
      c = randNonZero(-range, range); d = randNonZero(-range, range);
    } while(a * d - b * c === 0);
    const x = randNonZero(-8, 8), y = randNonZero(-8, 8);
    const e = a * x + b * y, f = c * x + d * y;
    const det = a * d - b * c;
    const eqn = fmtCoefX(a) + fmtAdd(b, 'y') + ' = ' + e + '\n' + fmtCoefX(c) + fmtAdd(d, 'y') + ' = ' + f;
    const steps = [
      'Multiply the first equation by ' + d + ' and the second by ' + b + ' so the y-terms match: ' +
        (a * d) + 'x' + fmtAdd(b * d, 'y') + ' = ' + (e * d) + ',  ' + (c * b) + 'x' + fmtAdd(d * b, 'y') + ' = ' + (f * b),
      'Subtract the equations to eliminate y: ' + det + 'x = ' + (e * d - f * b),
      'x = ' + (e * d - f * b) + ' ÷ ' + det + ' = ' + x,
      'Substitute x = ' + x + ' into the first equation to find y = ' + y
    ];
    return { prompt: 'Solve the simultaneous equations', answerLabel: '', hint: 'Format like x=3, y=-2',
      eqn, answerDisplay: 'x = ' + x + ', y = ' + y,
      checkAnswer: function(raw){
        const mx = raw.match(/x\s*=\s*(-?\d+(\.\d+)?)/i);
        const my = raw.match(/y\s*=\s*(-?\d+(\.\d+)?)/i);
        if(!mx || !my) return false;
        return Math.abs(parseFloat(mx[1]) - x) < 1e-6 && Math.abs(parseFloat(my[1]) - y) < 1e-6;
      }, steps };
  }
  function genSimultaneous1(){ return genSimultaneous(5); }
  function genSimultaneous2(){ return genSimultaneous(9); }

  function buildAngleLineDiagram(angle1Val, angle2Val, label1, label2){
    const size = 280, cx = 140, cy = 170, r = 95, arcR = 32, labelR = 52;
    const [ax, ay] = toXY(cx, cy, r, 0), [bx, by] = toXY(cx, cy, r, 180);
    const midDeg = -angle2Val;
    const [mx, my] = toXY(cx, cy, r, midDeg);
    const rightArc = describeArc(cx, cy, arcR, 0, midDeg, 10);
    const leftArc = describeArc(cx, cy, arcR, midDeg, 180, 10);
    const [rlx, rly] = toXY(cx, cy, labelR, arcBisectorDeg(0, midDeg));
    const [llx, lly] = toXY(cx, cy, labelR, arcBisectorDeg(midDeg, 180));
    const col = (l) => l.color || '#f1ede1';
    return '<svg viewBox="0 0 ' + size + ' 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:280px;height:auto;display:block;">' +
      '<line x1="' + ax + '" y1="' + ay + '" x2="' + bx + '" y2="' + by + '" stroke="#f1ede1" stroke-width="2"/>' +
      '<line x1="' + cx + '" y1="' + cy + '" x2="' + mx + '" y2="' + my + '" stroke="#f1ede1" stroke-width="2"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="3" fill="#f1ede1"/>' +
      '<polyline points="' + rightArc + '" fill="none" stroke="#e8c468" stroke-width="1.5"/>' +
      '<polyline points="' + leftArc + '" fill="none" stroke="#e8c468" stroke-width="1.5"/>' +

      '<text x="' + llx + '" y="' + lly + '" fill="' + col(label1) + '" font-size="14" font-family="Literata, serif" font-style="italic" text-anchor="middle">' + label1.text + '</text>' +
      '</svg>';
  }
  function buildAnglePointDiagram(angle1Val, angle2Val, label1, label2){
    const size = 300, cx = 150, cy = 150, r = 85, arcR1 = 26, arcR2 = 46, label1R = 44, label2R = 64;
    const [ax, ay] = toXY(cx, cy, r, 0);
    const rayBDeg = -angle1Val;
    const [bx, by] = toXY(cx, cy, r, rayBDeg);
    const smallArc = describeArc(cx, cy, arcR1, 0, rayBDeg, 10);
    const reflexArc = describeArc(cx, cy, arcR2, rayBDeg, 0, 32, true);
    const smallBisector = arcBisectorDeg(0, rayBDeg);
    const reflexBisector = smallBisector + 180;
    const [slx, sly] = toXY(cx, cy, label1R, smallBisector);

      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="rgba(var(--ink-rgb),0.15)" stroke-width="1" stroke-dasharray="4,3"/>' +
      '<line x1="' + cx + '" y1="' + cy + '" x2="' + ax + '" y2="' + ay + '" stroke="#f1ede1" stroke-width="2"/>' +
      '<line x1="' + cx + '" y1="' + cy + '" x2="' + bx + '" y2="' + by + '" stroke="#f1ede1" stroke-width="2"/>' +

  function buildAngleTriangleDiagram(l1, l2, l3){
    const pts = [[150, 40], [40, 220], [260, 220]];
    const cx = (150 + 40 + 260) / 3, cy = (40 + 220 + 220) / 3;
    const labels = [l1, l2, l3];

  function buildAngleTwoTerm(total, context){
    const x = randInt(5, 15), a = randInt(1, 3), b = randInt(1, 3);
    const c = total - (a + b) * x;
    const eqn = 'Two angles ' + context + ' are ' + fmtCoefX(a) + '° and (' + fmtCoefX(b) + fmtAdd(c) + ')°. Work out the value of x.';
    const steps = [
      fmtCoefX(a) + ' + ' + fmtCoefX(b) + fmtAdd(c) + ' = ' + total,
      (a + b) + 'x' + fmtAdd(c) + ' = ' + total + '   (collect like terms)',
      (a + b) + 'x = ' + (total - c) + '   (subtract ' + c + ' from both sides)',
      'x = ' + (total - c) + ' ÷ ' + (a + b) + ' = ' + x
    ];
    const angle1Value = a * x, angle2Value = b * x + c;
    const label1 = { text: fmtCoefX(a) + '°' }, label2 = { text: '(' + fmtCoefX(b) + fmtAdd(c) + ')°' };
    const diagram = total === 180
      ? buildAngleLineDiagram(angle1Value, angle2Value, label1, label2)
      : buildAnglePointDiagram(angle1Value, angle2Value, label1, label2);
    return { prompt: 'Solve for x', answerLabel: 'x =', hint: 'Give your answer as a number',
      eqn, diagram, answerDisplay: String(x), checkAnswer: numericChecker(x), steps };
  }
  function genAngleLine(){ return buildAngleTwoTerm(180, 'on a straight line'); }
  function genAnglePoint(){ return buildAngleTwoTerm(360, 'around a point'); }
  function genAngleLineOrPoint(){ return Math.random() < 0.5 ? genAngleLine() : genAnglePoint(); }

  function genAngleTriangle(){
    // Choose a, b, and x's range so that max(a*x, b*x) is guaranteed to exceed
    // the leftover constant c — a probabilistic bias isn't good enough here,
    // since "sometimes" still means a student can land on exactly the
    // degenerate case where the given constant IS the answer.
    let a, b, xMin, xMax;
    do{
      a = randInt(1, 4); b = randInt(1, 4);
      const mx = Math.max(a, b);
      xMin = Math.floor(180 / (mx + a + b)) + 1;
      xMax = Math.ceil(180 / (a + b)) - 1;
    } while(xMin > xMax || xMax < 5);
    xMin = Math.max(xMin, 5);
    const x = randInt(xMin, xMax);
    const c = 180 - (a + b) * x;
    const angle1 = a * x, angle2 = b * x, angle3 = c;
    const largest = Math.max(angle1, angle2, angle3);
    const eqn = 'The three angles in a triangle are ' + fmtCoefX(a) + '°, ' + fmtCoefX(b) + '° and ' + c + '°.';
    const baseSteps = [
      fmtCoefX(a) + ' + ' + fmtCoefX(b) + ' + ' + c + ' = 180',
      (a + b) + 'x + ' + c + ' = 180   (collect like terms)',
      (a + b) + 'x = ' + (180 - c) + '   (subtract ' + c + ' from both sides)',
      'x = ' + (180 - c) + ' ÷ ' + (a + b) + ' = ' + x
    ];
    const diagram = buildAngleTriangleDiagram({ text: fmtCoefX(a) + '°' }, { text: fmtCoefX(b) + '°' }, { text: c + '°' });
    const askX = Math.random() < 0.5;
    if(askX){
      return { prompt: 'Solve for x', answerLabel: 'x =', hint: 'Give your answer as a number',
        eqn, diagram, answerDisplay: String(x), checkAnswer: numericChecker(x), steps: baseSteps };
    }
    return { prompt: 'Work out the size of the largest angle', answerLabel: '=', hint: 'Give your answer in degrees, as a number',
      eqn, diagram, answerDisplay: String(largest), checkAnswer: numericChecker(largest),
      steps: baseSteps.concat([ 'The three angles are ' + angle1 + '°, ' + angle2 + '° and ' + angle3 + '° — the largest is ' + largest + '°.' ]) };
  }

  const TRIG_ANGLES = [30, 45, 60];
  function trigValues(deg){ const rad = deg * Math.PI / 180; return { sin: Math.sin(rad), cos: Math.cos(rad), tan: Math.tan(rad) }; }

  function buildRightTriangleAngleSVG(adjLen, oppLen, angleDeg, labelAdj, labelOpp, labelHyp){
    const maxDim = 155;

    const width = ax + padX * 2, height = by + padY * 2;
    const x0 = padX, y0 = height - padY, x1 = x0 + ax, y1 = y0, x2 = x0, y2 = y0 - by;
    const rsize = Math.min(14, ax * 0.2, by * 0.2);
    const r = Math.min(26, ax * 0.35);
    const degToV0 = degBetween(x1, y1, x0, y0), degToV2 = degBetween(x1, y1, x2, y2);
    const arcPts = describeArc(x1, y1, r, degToV0, degToV2, 10);
    const [alx, aly] = toXY(x1, y1, r + 18, arcBisectorDeg(degToV0, degToV2));

      '<path d="M ' + x0 + ' ' + (y0 - rsize) + ' L ' + (x0 + rsize) + ' ' + (y0 - rsize) + ' L ' + (x0 + rsize) + ' ' + y0 + '" fill="none" stroke="#f1ede1" stroke-width="1.5"/>' +

  function genTrig1(){
    const angleDeg = TRIG_ANGLES[randInt(0, 2)];

    const hyp = randInt(2, 10) * 2;
    const opp = hyp * sin, adj = hyp * cos;

  function genTrig2(){
    const angleDeg = TRIG_ANGLES[randInt(0, 2)];

  function genCircleTheorem2(){

  // ============================================================
  // TOPIC: TRANSFORMATIONS (translation & reflection on a grid)
  // ============================================================
  function buildGridSVG(trianglePts, mirrorAxis){
    const range = 7, size = 300;
    const scale = (size - 20) / (2 * range);
    const cx = size / 2, cy = size / 2;
    const toPx = (x, y) => [cx + x * scale, cy - y * scale];
    let gridLines = '';
    for(let i = -range; i <= range; i++){
      const [gx1, gy1] = toPx(i, -range), [gx2, gy2] = toPx(i, range);
      gridLines += '<line x1="' + gx1 + '" y1="' + gy1 + '" x2="' + gx2 + '" y2="' + gy2 + '" stroke="rgba(var(--ink-rgb),0.08)" stroke-width="1"/>';
      const [hx1, hy1] = toPx(-range, i), [hx2, hy2] = toPx(range, i);
      gridLines += '<line x1="' + hx1 + '" y1="' + hy1 + '" x2="' + hx2 + '" y2="' + hy2 + '" stroke="rgba(var(--ink-rgb),0.08)" stroke-width="1"/>';
    }
    const [ox1, oy1] = toPx(-range, 0), [ox2, oy2] = toPx(range, 0);
    const [oy1x, oy1y] = toPx(0, -range), [oy2x, oy2y] = toPx(0, range);
    let axes = '<line x1="' + ox1 + '" y1="' + oy1 + '" x2="' + ox2 + '" y2="' + oy2 + '" stroke="#f1ede1" stroke-width="1.5"/>' +
      '<line x1="' + oy1x + '" y1="' + oy1y + '" x2="' + oy2x + '" y2="' + oy2y + '" stroke="#f1ede1" stroke-width="1.5"/>';
    if(mirrorAxis === 'x') axes += '<line x1="' + ox1 + '" y1="' + oy1 + '" x2="' + ox2 + '" y2="' + oy2 + '" stroke="#e8c468" stroke-width="2.5" stroke-dasharray="4,3"/>';
    if(mirrorAxis === 'y') axes += '<line x1="' + oy1x + '" y1="' + oy1y + '" x2="' + oy2x + '" y2="' + oy2y + '" stroke="#e8c468" stroke-width="2.5" stroke-dasharray="4,3"/>';
    const pxPts = trianglePts.map(p => toPx(p.x, p.y));
    const polygonStr = pxPts.map(p => p[0] + ',' + p[1]).join(' ');
    let labels = '';
    trianglePts.forEach((p, i) => {
      const [px, py] = pxPts[i];
      labels += '<circle cx="' + px + '" cy="' + py + '" r="3.5" fill="#e8c468"/>' +
        '<text x="' + (px + 9) + '" y="' + (py - 7) + '" fill="#f1ede1" font-size="15" font-family="Work Sans, sans-serif" font-weight="600">' + p.label + '</text>';
    });
    return '<svg viewBox="0 0 ' + size + ' ' + size + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:300px;height:auto;display:block;">' +
      gridLines + axes + '<polygon points="' + polygonStr + '" fill="rgba(232,196,104,0.10)" stroke="#f1ede1" stroke-width="2"/>' + labels + '</svg>';
  }
  function genTransformTranslate(){
    const ax = randInt(-3, -1), ay = randInt(-2, 0);
    const A = { x: ax, y: ay, label: 'A' }, B = { x: ax + 2, y: ay, label: 'B' }, C = { x: ax, y: ay + 2, label: 'C' };
    let vx, vy; do{ vx = randInt(-3, 3); vy = randInt(-3, 3); } while(vx === 0 && vy === 0);
    const askVertex = ['A', 'B', 'C'][randInt(0, 2)];

      eqn: 'Triangle ABC has vertices A(' + A.x + ', ' + A.y + '), B(' + B.x + ', ' + B.y + '), C(' + C.x + ', ' + C.y + '). It is translated by the vector (' + vx + ', ' + vy + ').',
      diagram, answerDisplay: '(' + imgX + ', ' + imgY + ')', checkAnswer: coordChecker(imgX, imgY),

  function genTransformReflect(){
    const ax = randInt(-3, -1), ay = randInt(-2, 0);

      steps: axis === 'x'
        ? [ 'Reflecting in the x-axis keeps x the same and flips the sign of y.', askVertex + '(' + chosen.x + ', ' + chosen.y + ') → (' + imgX + ', ' + imgY + ')' ]

  function genTransformRotate(){
    const ax = randInt(-3, -1), ay = randInt(-2, 0);
    const A = { x: ax, y: ay, label: 'A' }, B = { x: ax + 2, y: ay, label: 'B' }, C = { x: ax, y: ay + 2, label: 'C' };

      eqn: 'Triangle ABC has vertices A(' + A.x + ', ' + A.y + '), B(' + B.x + ', ' + B.y + '), C(' + C.x + ', ' + C.y + '). It is rotated ' + angle + '° clockwise about the origin (0, 0).',
      diagram, answerDisplay: '(' + imgX + ', ' + imgY + ')', checkAnswer: coordChecker(imgX, imgY),

    const ax = randInt(-2, -1), ay = randInt(-1, 0);

  // ============================================================
  // TOPIC: STATISTICS (averages, and reading a bar chart)
  // ============================================================
  function distinctInts(n, min, max){ const set = new Set(); while(set.size < n) set.add(randInt(min, max)); return [...set]; }
  function genAverages(){
    const askType = ['mean', 'median', 'mode', 'range'][randInt(0, 3)];
    const distinct4 = distinctInts(4, 1, 20);
    const modeVal = distinct4[randInt(0, 3)];
    const nums = [...distinct4, modeVal].sort(() => Math.random() - 0.5);
    const sorted = [...nums].sort((a, b) => a - b);
    const mean = nums.reduce((a, b) => a + b, 0) / 5;
    const median = sorted[2];
    const range = sorted[4] - sorted[0];
    const answer = askType === 'mean' ? mean : askType === 'median' ? median : askType === 'mode' ? modeVal : range;
    const label = { mean: 'the mean', median: 'the median', mode: 'the mode', range: 'the range' }[askType];
    const steps = askType === 'mean' ? [ 'Mean = sum ÷ count = (' + nums.join(' + ') + ') ÷ 5 = ' + mean ]
      : askType === 'median' ? [ 'Sorted: ' + sorted.join(', '), 'Median = middle value = ' + median ]
      : askType === 'mode' ? [ 'The value that appears most often is ' + modeVal ]
      : [ 'Sorted: ' + sorted.join(', '), 'Range = highest − lowest = ' + sorted[4] + ' − ' + sorted[0] + ' = ' + range ];
    return { prompt: 'Find ' + label, answerLabel: '=', hint: 'Give your answer as a number',
      eqn: 'Data set: ' + nums.join(', '), answerDisplay: String(answer), checkAnswer: numericChecker(answer), steps };
  }

  function buildBarChartSVG(categories, values){
    const width = 320, height = 230, padL = 34, padB = 42, padT = 16, padR = 14;
    const maxVal = Math.max(...values);
    const rawStep = maxVal / 5;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
    const norm = rawStep / mag;
    const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    const chartMax = Math.ceil(maxVal / step) * step;
    const barAreaW = width - padL - padR, barAreaH = height - padT - padB;
    const n = categories.length, gap = barAreaW / n, barW = gap * 0.6;
    let gridLines = '', gridLabels = '';
    for(let v = 0; v <= chartMax; v += step){
      const y = padT + barAreaH - (v / chartMax) * barAreaH;
      gridLines += '<line x1="' + padL + '" y1="' + y + '" x2="' + (width - padR) + '" y2="' + y + '" stroke="rgba(var(--ink-rgb),0.08)" stroke-width="1"/>';
      gridLabels += '<text x="' + (padL - 6) + '" y="' + (y + 3) + '" fill="rgba(var(--ink-rgb),0.5)" font-size="10" font-family="Work Sans, sans-serif" text-anchor="end">' + v + '</text>';
    }
    let bars = '', labels = '';
    values.forEach((v, i) => {
      const barH = (v / chartMax) * barAreaH;
      const x = padL + i * gap + (gap - barW) / 2, y = padT + barAreaH - barH;
      bars += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + barH + '" fill="rgba(232,196,104,0.55)" stroke="#e8c468" stroke-width="1.5"/>';
      labels += '<text x="' + (x + barW / 2) + '" y="' + (padT + barAreaH + 16) + '" fill="#f1ede1" font-size="11" font-family="Work Sans, sans-serif" text-anchor="middle">' + categories[i] + '</text>';
    });
    return '<svg viewBox="0 0 ' + width + ' ' + height + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:320px;height:auto;display:block;">' +
      gridLines +
      '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT + barAreaH) + '" stroke="#f1ede1" stroke-width="1.5"/>' +
      '<line x1="' + padL + '" y1="' + (padT + barAreaH) + '" x2="' + (width - padR) + '" y2="' + (padT + barAreaH) + '" stroke="#f1ede1" stroke-width="1.5"/>' +
      gridLabels + bars + labels + '</svg>';
  }
  const CHART_THEMES = [

  const PYTHAGOREAN_TRIPLES = [[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[9,40,41]];

  // Draws a right-angled triangle with the right angle at bottom-left.
  // aLen/bLen are only used to pick a sensible, roughly-proportioned layout —
  // the diagram is always captioned "not to scale", as real exam diagrams are,
  // so a layout that merely looks plausible is fine; it doesn't need to be exact.
  function buildRightTriangleSVG(aLen, bLen, labelBottom, labelLeft, labelHyp){
    const maxDim = 155;
    const scale = maxDim / Math.max(aLen, bLen);
    const ax = Math.max(aLen * scale, 72), by = Math.max(bLen * scale, 72);
    const padX = 55, padY = 34;
    const width = ax + padX * 2, height = by + padY * 2;
    const x0 = padX, y0 = height - padY;
    const x1 = x0 + ax, y1 = y0;
    const x2 = x0, y2 = y0 - by;
    const rsize = Math.min(16, ax * 0.22, by * 0.22);
    const col = (l) => l.color || '#f1ede1';
    return '<svg viewBox="0 0 ' + width + ' ' + height + '" xmlns="http://www.w3.org/2000/svg" ' +
      'style="width:100%;max-width:300px;height:auto;display:block;">' +
      '<polygon points="' + x0 + ',' + y0 + ' ' + x1 + ',' + y1 + ' ' + x2 + ',' + y2 + '" ' +
        'fill="rgba(232,196,104,0.10)" stroke="#f1ede1" stroke-width="2" stroke-linejoin="round"/>' +
      '<path d="M ' + x0 + ' ' + (y0 - rsize) + ' L ' + (x0 + rsize) + ' ' + (y0 - rsize) + ' L ' + (x0 + rsize) + ' ' + y0 + '" ' +
        'fill="none" stroke="#f1ede1" stroke-width="1.5"/>' +
      '<text x="' + ((x0 + x1) / 2) + '" y="' + (y0 + 22) + '" fill="' + col(labelBottom) + '" font-size="15" ' +
        'font-family="Literata, serif" font-style="italic" text-anchor="middle">' + labelBottom.text + '</text>' +
      '<text x="' + (x0 - 12) + '" y="' + ((y0 + y2) / 2) + '" fill="' + col(labelLeft) + '" font-size="15" ' +
        'font-family="Literata, serif" font-style="italic" text-anchor="end" dominant-baseline="middle">' + labelLeft.text + '</text>' +
      '<text x="' + ((x1 + x2) / 2 + 14) + '" y="' + ((y1 + y2) / 2 - 2) + '" fill="' + col(labelHyp) + '" font-size="15" ' +
        'font-family="Literata, serif" font-style="italic" text-anchor="start">' + labelHyp.text + '</text>' +
      '</svg>';
  }

  function genPythagorasHyp(){
    const t = PYTHAGOREAN_TRIPLES[randInt(0, PYTHAGOREAN_TRIPLES.length - 1)];
    const k = randInt(1, 4);
    const a = t[0] * k, b = t[1] * k, c = t[2] * k;
    const diagram = buildRightTriangleSVG(a, b, { text: a + ' cm' }, { text: b + ' cm' }, { text: '?', color: '#e8c468' });
    return { prompt: 'Work out the length of the hypotenuse', answerLabel: '=', hint: 'Give your answer as a number (cm)',
      eqn: '', diagram,
      answerDisplay: String(c), checkAnswer: numericChecker(c),
      steps: [ 'c² = ' + a + '² + ' + b + '² = ' + (a * a) + ' + ' + (b * b) + ' = ' + (a * a + b * b), 'c = √' + (a * a + b * b) + ' = ' + c ] };
  }
  function genPythagorasLeg(){
    const t = PYTHAGOREAN_TRIPLES[randInt(0, PYTHAGOREAN_TRIPLES.length - 1)];
    const k = randInt(1, 4);
    const a = t[0] * k, b = t[1] * k, c = t[2] * k;
    const giveA = Math.random() < 0.5;
    const known = giveA ? a : b, unknown = giveA ? b : a;
    const labelBottom = giveA ? { text: a + ' cm' } : { text: '?', color: '#e8c468' };
    const labelLeft = giveA ? { text: '?', color: '#e8c468' } : { text: b + ' cm' };
    const diagram = buildRightTriangleSVG(a, b, labelBottom, labelLeft, { text: c + ' cm' });
    return { prompt: 'Work out the length of the missing side', answerLabel: '=', hint: 'Give your answer as a number (cm)',

        'a = √' + (c * c - known * known) + ' = ' + unknown ] };
  }

  function buildRectSVG(w, h, labelW, labelH){

  function inequalityChecker(op, k){
    const canon = { '<': '<', '>': '>', '<=': '<=', '>=': '>=', '≤': '<=', '≥': '>=' };
    const target = canon[op];
    return function(raw){
      const s = raw.replace(/\s+/g, '').toLowerCase().replace(/^x/, '');
      const m = s.match(/^(<=|>=|≤|≥|<|>)(-?\d+(\.\d+)?)$/);
      if(!m) return false;
      const gotOp = canon[m[1]];
      return gotOp === target && Math.abs(parseFloat(m[2]) - k) < 1e-6;
    };
  }

    const a = randInt(2, 9), k = randNonZero(-10, 10), b = randInt(-12, 12);

    const eqn = fmtCoefX(a) + fmtAdd(b) + ' ' + op + ' ' + c;
    return { prompt: 'Solve the inequality', answerLabel: '', hint: 'Format like x < 5 or x ≥ -2',
      eqn, answerDisplay: 'x ' + op + ' ' + k, checkAnswer: inequalityChecker(op, k),
      steps: [
        fmtCoefX(a) + ' ' + op + ' ' + (c - b) + '   (subtract ' + b + ' from both sides)',
        'x ' + op + ' ' + (c - b) + ' ÷ ' + a + '   (divide both sides by ' + a + ' — positive, so the direction stays the same)',
        'x ' + op + ' ' + k
      ] };
  }

  function buildProbTreeSVG(total, red, blue){

      lbl(start, r1, red + '/' + t) + lbl(start, b1, blue + '/' + t) +
      lbl(r1, rr, (red - 1) + '/' + t1) + lbl(r1, rb, blue + '/' + t1) +
      lbl(b1, br, red + '/' + t1) + lbl(b1, bb, (blue - 1) + '/' + t1) +
      dot(start, '') + dot(r1, 'Red') + dot(b1, 'Blue') +

      '</svg>';
  }

  // ============================================================

  // ============================================================
  function drawAxesAndGrid(range, size){
    const scale = (size - 20) / (2 * range);
    const cx = size / 2, cy = size / 2;
    const toPx = (x, y) => [cx + x * scale, cy - y * scale];
    let gridLines = '';
    for(let i = -range; i <= range; i++){
      const [gx1, gy1] = toPx(i, -range), [gx2, gy2] = toPx(i, range);
      gridLines += '<line x1="' + gx1 + '" y1="' + gy1 + '" x2="' + gx2 + '" y2="' + gy2 + '" stroke="rgba(var(--ink-rgb),0.08)" stroke-width="1"/>';
      const [hx1, hy1] = toPx(-range, i), [hx2, hy2] = toPx(range, i);
      gridLines += '<line x1="' + hx1 + '" y1="' + hy1 + '" x2="' + hx2 + '" y2="' + hy2 + '" stroke="rgba(var(--ink-rgb),0.08)" stroke-width="1"/>';
    }
    const [ox1, oy1] = toPx(-range, 0), [ox2, oy2] = toPx(range, 0);
    const [oy1x, oy1y] = toPx(0, -range), [oy2x, oy2y] = toPx(0, range);
    const axes = '<line x1="' + ox1 + '" y1="' + oy1 + '" x2="' + ox2 + '" y2="' + oy2 + '" stroke="#f1ede1" stroke-width="1.5"/>' +
      '<line x1="' + oy1x + '" y1="' + oy1y + '" x2="' + oy2x + '" y2="' + oy2y + '" stroke="#f1ede1" stroke-width="1.5"/>';
    return { gridLines, axes, toPx };
  }
  function genGraphEquation1(){
    const m = randNonZero(-6, 6), c = randInt(-10, 10);
    const askGradient = Math.random() < 0.5;
    return { prompt: askGradient ? 'What is the gradient of this line?' : 'What is the y-intercept of this line?', answerLabel: '=', hint: 'Give your answer as a number',
      eqn: 'y = ' + fmtCoefX(m) + fmtAdd(c),
      answerDisplay: String(askGradient ? m : c), checkAnswer: numericChecker(askGradient ? m : c),
      steps: [ 'In y = mx + c, m is the gradient and c is the y-intercept.', askGradient ? ('Gradient = ' + m) : ('y-intercept = ' + c) ] };
  }
  function buildLineGraphSVG(m, c, p1, p2){
    const range = 7, size = 300;
    const { gridLines, axes, toPx } = drawAxesAndGrid(range, size);
    function yAt(x){ return m * x + c; }
    function xAt(y){ return (y - c) / m; }
    let lx1 = -range, ly1 = yAt(-range), lx2 = range, ly2 = yAt(range);
    if(ly1 > range){ ly1 = range; lx1 = xAt(range); } else if(ly1 < -range){ ly1 = -range; lx1 = xAt(-range); }
    if(ly2 > range){ ly2 = range; lx2 = xAt(range); } else if(ly2 < -range){ ly2 = -range; lx2 = xAt(-range); }
    const [px1, py1] = toPx(lx1, ly1), [px2, py2] = toPx(lx2, ly2);
    const [ax, ay] = toPx(p1.x, p1.y), [bx, by] = toPx(p2.x, p2.y);
    const [midx, midy] = toPx(p2.x, p1.y);
    return '<svg viewBox="0 0 ' + size + ' ' + size + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:300px;height:auto;display:block;">' +
      gridLines + axes +
      '<line x1="' + px1 + '" y1="' + py1 + '" x2="' + px2 + '" y2="' + py2 + '" stroke="#e8c468" stroke-width="2.2"/>' +
      '<line x1="' + ax + '" y1="' + ay + '" x2="' + midx + '" y2="' + midy + '" stroke="#9fd8a6" stroke-width="1.3" stroke-dasharray="3,3"/>' +

  function buildCuboidSVG(l, w, h){
    const scale = 12;
    const fw = Math.max(l * scale, 55), fh = Math.max(h * scale, 55);
    const depth = Math.max(w * scale * 0.5, 32);
    const skewX = depth * 0.75, skewY = -depth * 0.5;
    const padX = 44, padY = 44;
    const x0 = padX, y0 = padY + Math.abs(skewY);
    const FBL = [x0, y0 + fh], FBR = [x0 + fw, y0 + fh], FTL = [x0, y0], FTR = [x0 + fw, y0];
    const shift = (p) => [p[0] + skewX, p[1] + skewY];
    const BBL = shift(FBL), BBR = shift(FBR), BTL = shift(FTL), BTR = shift(FTR);
    const width = fw + skewX + padX * 2, height = fh + Math.abs(skewY) + padY * 2;
    const poly = (pts) => pts.map(p => p[0] + ',' + p[1]).join(' ');
    return '<svg viewBox="0 0 ' + width + ' ' + height + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:280px;height:auto;display:block;">' +
      '<polygon points="' + poly([FTL, FTR, BTR, BTL]) + '" fill="rgba(232,196,104,0.18)" stroke="#f1ede1" stroke-width="1.5"/>' +
      '<polygon points="' + poly([FTR, FBR, BBR, BTR]) + '" fill="rgba(232,196,104,0.10)" stroke="#f1ede1" stroke-width="1.5"/>' +
      '<polygon points="' + poly([FTL, FTR, FBR, FBL]) + '" fill="rgba(232,196,104,0.22)" stroke="#f1ede1" stroke-width="1.8"/>' +
      '<text x="' + ((FBL[0] + FBR[0]) / 2) + '" y="' + (FBL[1] + 20) + '" fill="#f1ede1" font-size="14" font-family="Literata, serif" font-style="italic" text-anchor="middle">' + l + ' cm</text>' +
      '<text x="' + (FTL[0] - 10) + '" y="' + ((FTL[1] + FBL[1]) / 2) + '" fill="#f1ede1" font-size="14" font-family="Literata, serif" font-style="italic" text-anchor="end" dominant-baseline="middle">' + h + ' cm</text>' +
      '<text x="' + ((FTR[0] + BTR[0]) / 2 + 6) + '" y="' + ((FTR[1] + BTR[1]) / 2 - 6) + '" fill="#e8c468" font-size="14" font-family="Literata, serif" font-style="italic" text-anchor="start">' + w + ' cm</text>' +

  function buildScatterSVG(points){

  function genScatter1(){
    const type = ['positive', 'negative', 'none'][randInt(0, 2)];
    const points = [];
    for(let i = 0; i < 10; i++){
      const x = randInt(-8, 8);
      let y;
      if(type === 'positive') y = Math.round(x * 0.8 + randInt(-2, 2));
      else if(type === 'negative') y = Math.round(-x * 0.8 + randInt(-2, 2));
      else y = randInt(-9, 9);
      points.push({ x, y: Math.max(-9, Math.min(9, y)) });
    }
    const diagram = buildScatterSVG(points);
    const displayText = type === 'none' ? 'no correlation' : type + ' correlation';
    return { prompt: 'What type of correlation does this scatter graph show?', answerLabel: '', hint: 'Type: positive, negative, or none',
      eqn: '', diagram, answerDisplay: displayText,
      checkAnswer: function(raw){
        const s = raw.trim().toLowerCase();
        if(type === 'none') return s.includes('no') || s === 'none';
        return s.includes(type);
      },
      steps: [ type === 'positive' ? 'As x increases, y tends to increase too — that\'s positive correlation.'
        : type === 'negative' ? 'As x increases, y tends to decrease — that\'s negative correlation.'
        : 'There\'s no clear pattern between x and y — that\'s no correlation.' ] };
  }

  function genGroupedFreq1(){
    const numClasses = 4;
    let lower = 0;
    const classes = [];
    for(let i = 0; i < numClasses; i++){
      const width = [5, 10][randInt(0, 1)];
      const upper = lower + width;
      const freq = randInt(2, 12);
      classes.push({ lower, upper, freq });
      lower = upper;
    }
    const totalFreq = classes.reduce((s, c) => s + c.freq, 0);
    const sumFreqMid = classes.reduce((s, c) => s + c.freq * ((c.lower + c.upper) / 2), 0);
    const meanEstimate = round1dp(sumFreqMid / totalFreq);
    const tableText = classes.map(c => c.lower + '–' + c.upper + '   freq: ' + c.freq).join('\n');
    return { prompt: 'Estimate the mean (1 dp)', answerLabel: '=', hint: 'Give your answer as a number',
      eqn: 'Grouped data:\n' + tableText, answerDisplay: String(meanEstimate), checkAnswer: numericChecker(meanEstimate, 0.15),
      steps: [ 'Midpoints: ' + classes.map(c => (c.lower + c.upper) / 2).join(', '),
        'Estimated mean = Σ(frequency × midpoint) ÷ Σfrequency',
        '= ' + sumFreqMid + ' ÷ ' + totalFreq + ' ≈ ' + meanEstimate ] };
  }

  function buildBoxPlotSVG(min, q1, median, q3, max, hideKey){

    const vals = { min, q1, median, q3, max };
    const posX = { min: toPx(min), q1: toPx(q1), median: toPx(median), q3: toPx(q3), max: toPx(max) };
    let labels = '';
    Object.keys(vals).forEach(key => {
      const text = key === hideKey ? '?' : String(vals[key]);
      const color = key === hideKey ? '#e8c468' : '#f1ede1';
      labels += '<text x="' + posX[key] + '" y="' + (boxBottom + 22) + '" fill="' + color + '" font-size="12" font-family="Literata, serif" font-style="italic" text-anchor="middle">' + text + '</text>';
    });
    return '<svg viewBox="0 0 ' + width + ' ' + height + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:300px;height:auto;display:block;">' +
      '<line x1="' + posX.min + '" y1="' + whiskerY + '" x2="' + posX.q1 + '" y2="' + whiskerY + '" stroke="#f1ede1" stroke-width="1.8"/>' +
      '<line x1="' + posX.q3 + '" y1="' + whiskerY + '" x2="' + posX.max + '" y2="' + whiskerY + '" stroke="#f1ede1" stroke-width="1.8"/>' +
      '<line x1="' + posX.min + '" y1="' + (whiskerY - capHalf) + '" x2="' + posX.min + '" y2="' + (whiskerY + capHalf) + '" stroke="#f1ede1" stroke-width="1.8"/>' +
      '<line x1="' + posX.max + '" y1="' + (whiskerY - capHalf) + '" x2="' + posX.max + '" y2="' + (whiskerY + capHalf) + '" stroke="#f1ede1" stroke-width="1.8"/>' +
      '<rect x="' + posX.q1 + '" y="' + boxTop + '" width="' + (posX.q3 - posX.q1) + '" height="' + (boxBottom - boxTop) + '" fill="rgba(232,196,104,0.15)" stroke="#f1ede1" stroke-width="1.8"/>' +
      '<line x1="' + posX.median + '" y1="' + boxTop + '" x2="' + posX.median + '" y2="' + boxBottom + '" stroke="#e8c468" stroke-width="2"/>' +
      labels + '</svg>';
  }
  function genBoxPlot1(){
    const min = randInt(0, 8), q1 = min + randInt(2, 5), median = q1 + randInt(2, 5), q3 = median + randInt(2, 5), max = q3 + randInt(2, 5);
    const askType = ['median', 'q1', 'q3', 'range', 'iqr'][randInt(0, 4)];
    let hideKey = null, answer, promptText;
    if(askType === 'median'){ hideKey = 'median'; answer = median; promptText = 'What is the median?'; }
    else if(askType === 'q1'){ hideKey = 'q1'; answer = q1; promptText = 'What is the lower quartile (Q1)?'; }
    else if(askType === 'q3'){ hideKey = 'q3'; answer = q3; promptText = 'What is the upper quartile (Q3)?'; }
    else if(askType === 'range'){ answer = max - min; promptText = 'Work out the range'; }
    else { answer = q3 - q1; promptText = 'Work out the interquartile range (IQR)'; }
    const diagram = buildBoxPlotSVG(min, q1, median, q3, max, hideKey);
    const steps = askType === 'range' ? [ 'Range = highest − lowest = ' + max + ' − ' + min + ' = ' + (max - min) ]
      : askType === 'iqr' ? [ 'IQR = upper quartile − lower quartile = ' + q3 + ' − ' + q1 + ' = ' + (q3 - q1) ]
      : [ 'Read the value directly from the box plot.', 'Answer = ' + answer ];
    return { prompt: promptText, answerLabel: '=', hint: 'Give your answer as a number',
      eqn: '', diagram, answerDisplay: String(answer), checkAnswer: numericChecker(answer), steps };
  }

  // AUTH — class code + first name, token stored in localStorage.

  // artifact, so localStorage is the correct tool here.)

  const AUTH_KEY = 'solveit_auth';
  function getStoredAuth(){
    try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch(e){ return null; }
  }
  function setStoredAuth(auth){ localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); }
  function clearStoredAuth(){ localStorage.removeItem(AUTH_KEY); }

  let studentToken = null, studentName = '', className = '';

  async function apiFetch(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if(studentToken) opts.headers['x-student-token'] = studentToken;
    const res = await fetch(path, opts);
    let body = null;
    try { body = await res.json(); } catch(e){ /* no body */ }
    if(!res.ok) throw new Error((body && body.error) || ('Request failed: ' + res.status));
    return body;
  }

  // ============================================================
  // PERSISTENT TRACKING — now backed by the real server, not
  // per-browser storage, so progress follows the student across
  // devices and survives them clearing their browser.
  // ============================================================
  function defaultProgress(){ return { attempted: 0, correct: 0, bestStreak: 0, currentStreak: 0, last: [] }; }
  const progressCache = {};

  async function loadAllProgress(){
    const res = await apiFetch('/api/progress');
    TOPICS.filter(t => !t.locked).forEach(t => {
      progressCache[t.id] = res.progress[t.id] || defaultProgress();
    });
  }
  async function saveProgress(topicId, levelId, wasCorrect){
    const p = progressCache[topicId];
    await apiFetch('/api/progress', {
      method: 'POST',
      body: JSON.stringify({
        topicId, levelId, wasCorrect,
        attempted: p.attempted, correct: p.correct,
        bestStreak: p.bestStreak, currentStreak: p.currentStreak, last: p.last
      })
    });
  }

  function progressLine(p){
    if(!p || p.attempted === 0) return 'Not started yet';
    return p.correct + '/' + p.attempted + ' correct · best streak ' + p.bestStreak;
  }
  // Mastery requires BOTH a minimum number of attempts and a real accuracy
  // bar — a single lucky answer shouldn't read as "mastered". This is meant
  // to reflect genuine understanding, not just time spent in the app.
  function masteryLevel(p){
    if(!p || p.attempted === 0) return 'none';
    if(p.attempted >= 5 && (p.correct / p.attempted) >= 0.8) return 'mastered';
    return 'practicing';
  }
  function masteryBadge(level){
    if(level === 'mastered') return '<span class="mastery-badge mastered">✓ Mastered</span>';
    if(level === 'practicing') return '<span class="mastery-badge practicing">In progress</span>';
    return '';
  }

  function renderHome(){
    els.topicGrid.innerHTML = '';
    const unlockedTopics = TOPICS.filter(t => !t.locked);
    const masteredCount = unlockedTopics.filter(t => masteryLevel(progressCache[t.id]) === 'mastered').length;
    if(els.masterySummary){
      if(masteredCount > 0){
        const pct = Math.round((masteredCount / unlockedTopics.length) * 100);
        els.masterySummary.innerHTML =
          '<div class="mastery-summary-text">' + masteredCount + ' of ' + unlockedTopics.length + ' topics mastered</div>' +
          '<div class="mastery-summary-bar"><div class="mastery-summary-fill" style="width:' + pct + '%;"></div></div>';
        els.masterySummary.classList.remove('hidden');
      } else {
        els.masterySummary.classList.add('hidden');
      }
    }
    TOPICS.forEach(topic => {
      const card = document.createElement('div');
      const level = topic.locked ? 'none' : masteryLevel(progressCache[topic.id]);
      card.className = 'topic-card' + (topic.locked ? ' locked' : '') + (level === 'mastered' ? ' mastered' : '');
      const progHtml = topic.locked ? '' : '<div class="progress-line">' + progressLine(progressCache[topic.id]) + '</div>';
      card.innerHTML =
        (topic.locked ? '' : masteryBadge(level)) +
        '<h2>' + topic.name + '</h2>' +
        '<p class="tag">' + topic.tagline + '</p>' +
        (topic.locked ? '<span class="coming-soon-tag">Coming soon</span>' : '<div class="example">' + topic.example + '</div>') +
        progHtml;
      if(!topic.locked) card.addEventListener('click', () => openTopic(topic));
      els.topicGrid.appendChild(card);
    });
    els.loadingNote.classList.add('hidden');
    els.topicGrid.classList.remove('hidden');
    els.homeFooter.classList.remove('hidden');
    els.homeScreen.classList.remove('hidden');
    els.practiceScreen.classList.add('hidden');
  }

  function openTopic(topic){
    state.topic = topic;
    state.level = topic.levels[0];
    els.topicTitle.textContent = topic.name;
    els.topicSub.textContent = topic.tagline;
    els.tabs.innerHTML = '';
    topic.levels.forEach((lvl, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (i === 0 ? ' active' : '');
      btn.textContent = lvl.label;
      btn.addEventListener('click', () => {
        els.tabs.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        state.level = lvl;
        newQuestion();
      });
      els.tabs.appendChild(btn);
    });
    els.homeScreen.classList.add('hidden');
    els.practiceScreen.classList.remove('hidden');
    updateFooter();
    newQuestion();
  }

  function newQuestion(){
    state.current = state.level.generate();
    els.promptText.textContent = state.current.prompt;
    if(state.current.diagram){
      els.diagramArea.innerHTML = state.current.diagram;
      els.diagramArea.classList.remove('hidden');
      els.diagramCaption.classList.remove('hidden');
    } else {
      els.diagramArea.innerHTML = '';
      els.diagramArea.classList.add('hidden');
      els.diagramCaption.classList.add('hidden');
    }
    els.equation.textContent = state.current.eqn;
    els.equation.classList.toggle('hidden', !state.current.eqn);
    els.answerLabel.textContent = state.current.answerLabel;
    els.hintText.textContent = state.current.hint;
    els.answer.value = '';
    els.answer.disabled = false;
    els.markBtn.disabled = false;
    els.workingBtn.disabled = true;
    els.workingBtn.textContent = 'Show working';
    els.working.classList.remove('show');
    els.working.innerHTML = '';
    els.feedback.classList.remove('show');

    state.chatHistory = [];
    els.tutorMessages.innerHTML = '<p class="tutor-empty">Stuck, or just want a hint? Ask Claude about this question.</p>';
    els.tutorPanel.classList.add('hidden');
    els.tutorBtn.textContent = 'Ask for help';

    els.answer.focus();
  }

  function renderDots(){
    els.dots.innerHTML = '';
    (progressCache[state.topic.id].last || []).slice(-8).forEach(r => {
      const d = document.createElement('div');

      els.dots.appendChild(d);
