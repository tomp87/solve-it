<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics — Solve It</title>
<meta name="robots" content="noindex" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Work+Sans:wght@400;500;600;700&display=swap');
  :root{
    --ink-rgb: 43,36,24;
    --chalk-bg-1: #faf6ed; --chalk-bg-2: #f2ead8; --panel: #fffdf8; --panel-edge: rgba(var(--ink-rgb),0.14);
    --chalk-white: #2b2418; --chalk-dim: rgba(var(--ink-rgb),0.62); --chalk-faint: rgba(var(--ink-rgb),0.32);
    --chalk-yellow: #b5651d; --chalk-green: #1f7a52; --accent-ink: #fffaf0;
  }
  [data-theme="dark"]{
    --ink-rgb: 241,237,225;
    --chalk-bg-1: #14231b; --chalk-bg-2: #1d3327; --panel: #223a2c;
    --chalk-white: #f1ede1; --chalk-yellow: #e8c468; --chalk-green: #9fd8a6; --accent-ink: #1d2a1f;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; min-height:100%; background: radial-gradient(ellipse at 20% 0%, var(--chalk-bg-2) 0%, var(--chalk-bg-1) 60%); color: var(--chalk-white); font-family:'Work Sans', sans-serif; }
  body{ padding: 48px 20px; display:flex; flex-direction:column; align-items:center; }
  .wrap{ width:100%; max-width: 700px; }
  h1{ font-family:'Caveat', cursive; font-weight:700; font-size:2.2rem; color: var(--chalk-yellow); text-align:center; margin:0 0 30px; }

  .key-card{ background: var(--panel); border:1px solid var(--panel-edge); border-radius:14px; padding:26px; text-align:center; }
  .key-card input{ width:100%; max-width:320px; background:rgba(var(--ink-rgb),0.05); border:1px solid var(--panel-edge); border-radius:8px; color: var(--chalk-white); font-size:0.95rem; padding:10px 14px; text-align:center; outline:none; margin: 12px 0; }
  .key-card button{ background: var(--chalk-yellow); color: var(--accent-ink); font-weight:600; border:none; border-radius:8px; padding:10px 22px; cursor:pointer; font-size:0.9rem; }
  .error{ color:#b23b2e; font-size:0.85rem; margin-top:10px; }

  .funnel{ display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; margin-bottom: 24px; }
  .funnel-card{ background: var(--panel); border:1px solid var(--panel-edge); border-radius:12px; padding:20px; text-align:center; }
  .funnel-card .num{ font-family:'Caveat',cursive; font-size:2.2rem; color: var(--chalk-yellow); }
  .funnel-card .label{ font-size:0.78rem; color: var(--chalk-dim); }
  .funnel-card .rate{ font-size:0.7rem; color: var(--chalk-faint); margin-top:4px; }

  .section-title{ font-size:0.85rem; font-weight:600; margin: 26px 0 10px; color: var(--chalk-dim); text-transform:uppercase; letter-spacing:0.04em; }
  .page-table{ background: var(--panel); border:1px solid var(--panel-edge); border-radius:12px; overflow:hidden; }
  .page-row{ display:flex; justify-content:space-between; padding:10px 18px; border-bottom:1px solid var(--panel-edge); font-size:0.88rem; }
  .page-row:last-child{ border-bottom:none; }
  .page-row .count{ color: var(--chalk-yellow); font-weight:600; }
  .ranges{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:22px; }
  .ranges button{ background:var(--panel); color:var(--chalk-white); border:1px solid var(--panel-edge); border-radius:999px; padding:8px 16px; cursor:pointer; font:600 0.85rem 'Work Sans',sans-serif; }
  .ranges button.on{ background:var(--chalk-yellow); color:var(--accent-ink); border-color:var(--chalk-yellow); }
  .chart{ background:var(--panel); border:1px solid var(--panel-edge); border-radius:12px; padding:16px 14px 10px; }
  .bars{ display:flex; align-items:flex-end; gap:2px; height:120px; }
  .bar{ flex:1; min-width:2px; background:var(--chalk-yellow); border-radius:3px 3px 0 0; opacity:.9; }
  .bar.zero{ background:var(--panel-edge); height:2px !important; }
  .axis{ display:flex; justify-content:space-between; font-size:0.7rem; color:var(--chalk-dim); margin-top:6px; }
  .hidden{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Solve It — Analytics</h1>

  <div class="key-card" id="keyCard">
    <p>Enter your analytics key to view stats.</p>
    <input type="password" id="keyInput" placeholder="Analytics key" />
    <br/>
    <button id="viewBtn">View stats</button>
    <p class="error" id="keyError"></p>
  </div>

  <div id="statsView" class="hidden">
    <div class="ranges" id="ranges">
      <button data-r="today">Today</button>
      <button data-r="yesterday">Yesterday</button>
      <button data-r="7d">7 days</button>
      <button data-r="30d">30 days</button>
      <button data-r="all">All time</button>
    </div>

    <div class="section-title" id="totalsTitle">Totals</div>
    <div class="funnel" id="funnel"></div>

    <div class="section-title" id="chartTitle">Page views over time</div>
    <div class="chart" id="chart"></div>

    <div class="section-title">By page</div>
    <div class="page-table" id="pageTable"></div>
  </div>
</div>
<script>
(function(){
  const els = {
    keyCard: document.getElementById('keyCard'),
    keyInput: document.getElementById('keyInput'),
    viewBtn: document.getElementById('viewBtn'),
    keyError: document.getElementById('keyError'),
    statsView: document.getElementById('statsView'),
    funnel: document.getElementById('funnel'),
    chart: document.getElementById('chart'),
    pageTable: document.getElementById('pageTable'),
    ranges: document.getElementById('ranges'),
    totalsTitle: document.getElementById('totalsTitle'),
    chartTitle: document.getElementById('chartTitle'),
  };
  const LABELS = { today: 'Today', yesterday: 'Yesterday', '7d': 'Last 7 days', '30d': 'Last 30 days', all: 'All time' };
  let currentKey = '', currentRange = '7d';
  try{ currentRange = sessionStorage.getItem('solveit_analytics_range') || '7d'; } catch(e){}
  if(!LABELS[currentRange]) currentRange = '7d';

  function esc(t){ return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function sumByType(rows, type){ return rows.filter(r => r.eventType === type).reduce((s, r) => s + r.count, 0); }
  function pct(a, b){ return b > 0 ? Math.round((a / b) * 100) + '%' : '—'; }

  function renderFunnel(rows){
    const views = sumByType(rows, 'page_view');
    const started = sumByType(rows, 'checkout_started');
    const converted = sumByType(rows, 'converted');
    els.funnel.innerHTML =
      '<div class="funnel-card"><div class="num">' + views + '</div><div class="label">Page views</div></div>' +
      '<div class="funnel-card"><div class="num">' + started + '</div><div class="label">Checkout started</div><div class="rate">' + pct(started, views) + ' of views</div></div>' +
      '<div class="funnel-card"><div class="num">' + converted + '</div><div class="label">Converted</div><div class="rate">' + pct(converted, started) + ' of starts</div></div>';
  }

  // Build the list of chart buckets (hours of the day, or days) and fill the gaps with zero.
  function londonDate(offsetDays){
    const d = new Date(Date.now() - offsetDays * 86400000);
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year:'numeric', month:'2-digit', day:'2-digit' }).format(d);
  }
  function renderChart(data){
    const map = {}; data.series.forEach(p => { map[p.bucket] = p.count; });
    let keys = [], labels = [];
    if(data.bucket === 'hour'){
      for(let h = 0; h < 24; h++){ keys.push(String(h).padStart(2, '0')); }
      labels = ['00:00', '12:00', '23:00'];
    } else {
      const n = data.range === '7d' ? 7 : data.range === '30d' ? 30 : 60;
      for(let i = n - 1; i >= 0; i--){ keys.push(londonDate(i)); }
      labels = [keys[0], keys[Math.floor(keys.length / 2)], keys[keys.length - 1]];
    }
    const vals = keys.map(k => map[k] || 0);
    const max = Math.max.apply(null, vals.concat([1]));
    els.chartTitle.textContent = data.bucket === 'hour' ? 'Page views by hour (UK time)' : 'Page views per day';
    els.chart.innerHTML = '<div class="bars">' + vals.map((v, i) =>
      '<div class="bar' + (v ? '' : ' zero') + '" style="height:' + Math.max(2, Math.round(v / max * 100)) + '%" title="' + esc(keys[i]) + ': ' + v + '"></div>').join('') +
      '</div><div class="axis"><span>' + esc(labels[0]) + '</span><span>' + esc(labels[1]) + '</span><span>' + esc(labels[2]) + '</span></div>';
  }

  function renderPageTable(rows){
    const pages = [...new Set(rows.filter(r => r.page).map(r => r.page))];
    if(pages.length === 0){ els.pageTable.innerHTML = '<div class="page-row">No page-level data for this period.</div>'; return; }
    const countFor = (page, type) => (rows.find(r => r.page === page && r.eventType === type) || {}).count || 0;
    els.pageTable.innerHTML =
      '<div class="page-row" style="font-weight:600;"><span>Page</span><span>Views → Starts → Converted</span></div>' +
      pages.sort((a, b) => countFor(b, 'page_view') - countFor(a, 'page_view'))
        .map(p => '<div class="page-row"><span>' + esc(p) + '</span><span class="count">' +
          countFor(p, 'page_view') + ' → ' + countFor(p, 'checkout_started') + ' → ' + countFor(p, 'converted') +
          '</span></div>').join('');
  }

  function markRange(){
    els.ranges.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.r === currentRange));
  }

  async function loadStats(key, range){
    els.keyError.textContent = '';
    currentKey = key; currentRange = range || currentRange;
    try{
      const res = await fetch('/api/analytics/summary?key=' + encodeURIComponent(key) + '&range=' + encodeURIComponent(currentRange));
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Could not load stats');
      els.totalsTitle.textContent = LABELS[data.range] || 'Totals';
      renderFunnel(data.rows);
      renderChart(data);
      renderPageTable(data.rows);
      markRange();
      els.keyCard.classList.add('hidden');
      els.statsView.classList.remove('hidden');
      try{ sessionStorage.setItem('solveit_analytics_key', key); sessionStorage.setItem('solveit_analytics_range', currentRange); } catch(e){}
    } catch(e){
      els.keyError.textContent = e.message;
    }
  }

  els.ranges.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-r]');
    if(b) loadStats(currentKey, b.dataset.r);
  });

  els.viewBtn.addEventListener('click', () => loadStats(els.keyInput.value.trim()));
  els.keyInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') loadStats(els.keyInput.value.trim()); });

  // Convenience: remember the key for this browser tab session only (not
  // persisted beyond that), so refreshing doesn't require retyping it.
  try{
    const saved = sessionStorage.getItem('solveit_analytics_key');
    if(saved) loadStats(saved);
  } catch(e){}
})();
</script>
</body>
</html>
